<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Definitions for reusable elements and clip masks -->
  <defs>
    <clipPath id="toast-body-clip">
      <path d="M 120 180 
               C 85 160, 80 110, 115 75 
               C 150 40, 205 50, 256 68 
               C 307 50, 362 40, 397 75 
               C 432 110, 427 160, 392 180 
               C 415 220, 412 360, 400 410 
               C 390 450, 360 452, 256 452 
               C 152 452, 122 450, 112 410 
               C 100 360, 97 220, 120 180 Z" />
    </clipPath>
  </defs>

  <!-- Bread Crust (Outer Silhouette) -->
  <path d="M 120 180 
           C 85 160, 80 110, 115 75 
           C 150 40, 205 50, 256 68 
           C 307 50, 362 40, 397 75 
           C 432 110, 427 160, 392 180 
           C 415 220, 412 360, 400 410 
           C 390 450, 360 452, 256 452 
           C 152 452, 122 450, 112 410 
           C 100 360, 97 220, 120 180 Z" 
        fill="#FFFFFF" />

  <!-- Inner Soft Bread Area (Cutout Layer) -->
  <path d="M 134 186 
           C 105 168, 102 126, 130 96 
           C 158 66, 205 76, 256 92 
           C 307 76, 354 66, 382 96 
           C 410 126, 407 168, 378 186 
           C 396 224, 394 350, 382 394 
           C 372 430, 346 432, 256 432 
           C 166 432, 140 430, 130 394 
           C 118 350, 116 224, 134 186 Z" 
        fill="#000000" />

  <!-- Evil Face Elements (Crisp White Monochromatic Fill) -->
  <g fill="#FFFFFF">
    <!-- Left Angled Eyebrow -->
    <polygon points="152,192 232,238 226,252 146,206" />

    <!-- Right Angled Eyebrow -->
    <polygon points="360,192 280,238 286,252 366,206" />

    <!-- Left Sinister Eye -->
    <path d="M 160 220 
             Q 205 242 228 258 
             Q 190 286 160 220 Z" />

    <!-- Right Sinister Eye -->
    <path d="M 352 220 
             Q 307 242 284 258 
             Q 322 286 352 220 Z" />

    <!-- Sharp Grinning Mouth -->
    <path d="M 166 308 
             Q 256 322 346 308 
             Q 324 388 256 392 
             Q 188 388 166 308 Z" />
  </g>

  <!-- Piercing Sharp Teeth (Black Cutouts inside Mouth) -->
  <g fill="#000000">
    <!-- Top Row Fangs -->
    <polygon points="186,311 202,313 194,334" />
    <polygon points="214,315 234,316 224,342" />
    <polygon points="246,317 266,317 256,344" />
    <polygon points="278,316 298,315 288,342" />
    <polygon points="310,313 326,311 318,334" />

    <!-- Bottom Row Serrated Points -->
    <polygon points="202,364 218,368 210,348" />
    <polygon points="234,374 250,375 242,352" />
    <polygon points="262,375 278,374 270,352" />
    <polygon points="294,368 310,364 302,348" />
  </g>

  <!-- Singed Crust & Bite/Crack Accents (White Details) -->
  <g fill="#FFFFFF">
    <!-- Forehead Stress/Burn Crack -->
    <path d="M 253 118 
             L 259 146 
             L 248 162 
             L 254 182 
             L 249 181 
             L 244 163 
             L 254 147 
             L 248 119 Z" />

    <!-- Cheek Char Hatch Marks -->
    <rect x="146" y="278" width="16" height="4" rx="2" transform="rotate(-15 146 278)" />
    <rect x="142" y="292" width="22" height="4" rx="2" transform="rotate(-15 142 292)" />
    <rect x="350" y="274" width="16" height="4" rx="2" transform="rotate(15 350 274)" />
    <rect x="348" y="288" width="22" height="4" rx="2" transform="rotate(15 348 288)" />
  </g>
</svg>
