    /* LittleLink Dark Mode Base & Custom Alignment */
    body {

      margin-bottom: 12px;
      padding: 0 16px;

      color: #ffffff;

      border-radius: 8px;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 600;
      box-sizing: border-box;
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }

    .button-link:hover {
      background-color: #2f2f2f;
      border-color: #4a4a4a;
      color: #ffffff;
    }

    .button-link img {
      width: 20px;
      height: 20px;
      margin-right: 10px;
      filter: invert(1); /* Adapts standard monochrome SVGs for dark backgrounds */
    }

    .footer {
      margin-top: 48px;
      font-size: 0.75rem;
      color: #666666;
    }
