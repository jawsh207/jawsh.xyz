/* Base page setup: safe-area padding (notches/home-indicator), full-height html/body, and a

:root{--bg:#120d0a;--ink:#f4e6c1;box-sizing:border-box;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#120d0a;--ink:#f4e6c1}}
:root[data-theme="dark"]{--bg:#120d0a;--ink:#f4e6c1}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);position:relative;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none;font-family:Bangers,Impact,'Arial Black',fantasy}
#app{width:100%;height:100%;display:flex;align-items:center;justify-content:center;position:relative}

/* The landscape auto-rotation trick: on a touchscreen held in portrait, spin the ENTIRE body
   90 degrees and swap its width/height, so the game always renders as landscape regardless of
   how the phone is actually being held - no native orientation-lock permission needed for this
   part. (vh/vw declared first as a fallback, then overridden by dvh/dvw where supported, since
   those correctly account for mobile browser toolbars showing/hiding.) */
@media (orientation:portrait) and (pointer:coarse){
  body{
    position:fixed;top:0;left:0;
    width:100vh;width:100dvh;
    height:100vw;height:100dvw;
    transform:rotate(90deg) translateY(-100%);
    transform-origin:0 0;
  }
}

let meterNeed=6;

// there are no sound files. AC=the audio context. MG=master volume gain. SH=the distortion
// curve used by the music. NB=one shared pre-made noise buffer, reused by every 'noiz()'

// over a long play session (this caused real bugs earlier - see conversation history)
// until the audio glitches out and dies, so every sound cleans up after itself via this.

// ---- Touch/mouse input ----
// rotMQ tracks whether the CSS auto-landscape-rotation is currently active, so we know
// which way to translate a raw screen tap into the game's own (un-rotated) coordinates.
const rotMQ=matchMedia('(orientation:portrait) and (pointer:coarse)');
// Converts a raw pointer/touch event into game-world (x,y) coordinates, accounting for
// the canvas's current scale and (if active) the portrait->landscape CSS rotation.
function pt(e){let lx,ly;
 if(rotMQ.matches){lx=e.clientY;ly=innerWidth-e.clientX}else{lx=e.clientX;ly=e.clientY}
 const ox=(APP.clientWidth-C.clientWidth)/2,oy=(APP.clientHeight-C.clientHeight)/2;
 return[(lx-ox)/C.clientWidth*W,(ly-oy)/C.clientHeight*H]}
// Real <button> click = the one fullscreen trigger that works reliably across mobile browsers
// (see the comment on #startBtn in the HTML above). The rest of the title-tap/game-start logic
// still goes through the normal pointerdown handler just below, same as every other tap.
const startBtn=document.getElementById('startBtn');

document.addEventListener('pointerdown',e=>{e.preventDefault();const[x,y]=pt(e);

   if(y>H/2-20&&y<H/2+24)startAdView();          // WATCH AD: CONTINUE
   else if(y>H/2+38&&y<H/2+82)endRun();          // NO THANKS
  }else if(adPlaying&&contT<=0&&x>W/2-130&&x<W/2+130){
   // must match the dynamic button position computed in draw() for this same state
   const adGH=cl(AD_H/adSC,120,340),belowY=H/2+adGH/2+28;
   if(y>belowY&&y<belowY+44)finishAdView();       // CONTINUE (unlocked after the viewing window)
  }

// Spends the kill-charge meter and starts the slam, if it's actually full - shared by both the
// on-screen SLAM burst (tap) and a controller's button press, so the two stay in sync.
function tryActivateSlam(){if(meter/meterMax()>=1&&P.slam==null){meter=0;meterNeed=4+wave*2;P.slam=.0001;P.slamHit=false;P.slamX=P.x;P.slamY=P.y}}
// ---- Controller (Gamepad API) support ----
// Movement and firing are read live every frame (see up()); menu/action buttons are
// edge-triggered here instead (comparing against last frame's state) so holding one down
// doesn't repeatedly fire the action, matching how a single tap/click behaves elsewhere.
// No 'gamepadconnected' handling is needed beyond this - browsers only populate
// navigator.getGamepads() once a button has actually been pressed on it at least once.

// unavailable here - e.g. a page embedded in a context whose permissions policy disallows
// it (some sandboxed/iframed previews do this), which makes navigator.getGamepads() throw a
// SecurityError rather than just returning nothing. Controller support simply no-ops in that
// case; everything else (touch/keyboard) is unaffected.
let gpBlocked=false;
function pollGamepad(){

 let pads;
 try{pads=navigator.getGamepads?navigator.getGamepads():null}catch(e){gpBlocked=true;GP.dx=0;GP.dy=0;GP.fire=false;return}

 let dx=gp.axes[0]||0,dy=gp.axes[1]||0;const b=gp.buttons;

 if(b[12]&&b[12].pressed)dy-=1;if(b[13]&&b[13].pressed)dy+=1; // d-pad up/down
 GP.dx=Math.abs(dx)>.15?dx:0;GP.dy=Math.abs(dy)>.15?dy:0; // small deadzone
 GP.fire=!!(b[0]&&b[0].pressed);
 const aNow=!!(b[0]&&b[0].pressed),bNow=!!(b[1]&&b[1].pressed),xNow=!!(b[2]&&b[2].pressed),stNow=!!(b[9]&&b[9].pressed);
 const aEdge=aNow&&!gpPrev.a,bEdge=bNow&&!gpPrev.b,xEdge=xNow&&!gpPrev.x,stEdge=stNow&&!gpPrev.start;
 gpPrev={a:aNow,b:bNow,x:xNow,start:stNow};
 // A = confirm/fire-screen-action, B = cancel/restart/slam, X = sound toggle, Start = pause.
 // (buttons 0/1/2/9 are 'A'/'B'/'X'/'Start' on a standard Xbox-style layout; indices are the
