X.fillStyle='#ff6a2b';X.beginPath();X.moveTo(-5,-3);X.lineTo(15,-5);X.lineTo(20,-2);X.lineTo(15,1);X.lineTo(-5,5);X.closePath();X.fill();ol(2);
X.fillStyle='#333';X.fillRect(19,-3,4,3);

function drawP(){const x=P.x,y=P.y;
if(P.slam!=null){const px=P.slamX-12,py=P.slamY+12,pr=Math.min(1,P.slam/.32);
 const ang=pr<1?(-2.1+2.7*(1-Math.pow(1-pr,3))):Math.PI/2,len=90;

 X.beginPath();X.moveTo(px,py);X.lineTo(bx,by);X.lineWidth=5;X.strokeStyle='#111';X.stroke();X.lineWidth=2.5;X.strokeStyle='#999';X.stroke();
 X.beginPath();X.arc(bx,by,10,0,7);X.fillStyle='#222';X.fill();ol(2.5);X.fillStyle='#777';X.beginPath();X.arc(bx-3,by-3,3,0,7);X.fill();
 if(pr>=1){X.strokeStyle='rgba(255,255,255,.8)';X.lineWidth=3;for(let i=0;i<4;i++){const a2=i/4*6.28;X.beginPath();X.moveTo(bx,by);X.lineTo(bx+Math.cos(a2)*16,by+Math.sin(a2)*16);X.stroke()}}

for(let i=0;i<5;i++)X.fillStyle=i%2?'#111':'#fff',X.fillRect(-12,-8+i*4.4,24,4.4);X.strokeStyle='#111';X.lineWidth=2.5;X.strokeRect(-12,-8,24,22);

// ---- audio (all sounds are synthesized in the browser at runtime - original, royalty-free)
let AC=null,MG=null,SH=null,NB=null,musT=null,muted=false;
function toggleMute(){muted=!muted;if(MG)MG.gain.value=muted?0:.55}
function sG(){const g=AC.createGain();g.connect(MG);return g}
function rip(...ns){for(const n of ns)try{n.disconnect()}catch(e){}}
function tone(freq,dur,type,vol,slide){try{const o=AC.createOscillator(),g=sG();o.type=type||'square';
 o.frequency.setValueAtTime(freq,AC.currentTime);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,slide),AC.currentTime+dur);
 g.gain.setValueAtTime(vol,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+dur);
 o.connect(g);o.onended=()=>rip(o,g);o.start();o.stop(AC.currentTime+dur+.02)}catch(e){}}
function noiz(dur,freq,q,vol,at){try{const src=AC.createBufferSource();src.buffer=NB;src.loop=true;
 const off=R()*(NB.duration-dur-.01);
 const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=freq;f.Q.value=q;const g=sG();
 const t0=at||AC.currentTime;g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(.001,t0+dur);
 src.connect(f);f.connect(g);src.onended=()=>rip(src,f,g);src.start(t0,off);src.stop(t0+dur)}catch(e){}}
function sCrunch(big){noiz(big?.32:.16,big?600:950,1.1,big?1:.85);tone(big?90:150,big?.3:.12,'square',big?.7:.45,big?30:55)}
function sSplat(big){noiz(big?.4:.22,big?260:360,.7,big?1:.75);tone(big?150:220,big?.4:.22,'sine',big?.6:.4,big?60:80)}
function sHurt(){tone(240,.22,'sawtooth',.45,85)}
function sShoot(){noiz(.05,2400,2,.28)}
function sPow(){tone(260,.5,'sawtooth',.5,1000);noiz(.5,1300,1,.4)}
function ensureAudio(){if(AC)return;try{AC=new(window.AudioContext||window.webkitAudioContext)();
 MG=AC.createGain();MG.gain.value=.55;MG.connect(AC.destination);
 SH=AC.createWaveShaper();const n=44100,cv=new Float32Array(n);for(let i=0;i<n;i++){const x=i*2/n-1;cv[i]=Math.tanh(x*4)}SH.curve=cv;SH.oversample='2x';SH.connect(MG);
 const nn=AC.sampleRate*1;NB=AC.createBuffer(1,nn,AC.sampleRate);const nd=NB.getChannelData(0);for(let i=0;i<nn;i++)nd[i]=R()*2-1;
 startMusic()}catch(e){}}
function startMusic(){const bpm=176,step=60/bpm/2,riff=[55,55,65,73,82,82,73,65,55,55,65,73,98,87,73,65];
 let st=0,next=AC.currentTime+.05;
 function playStep(when){try{const f=riff[st%riff.length];
  const o=AC.createOscillator();o.type='sawtooth';o.frequency.value=f;const g=AC.createGain();
  g.gain.setValueAtTime(.001,when);g.gain.linearRampToValueAtTime(.22,when+.01);g.gain.exponentialRampToValueAtTime(.001,when+step*.9);
  o.connect(g);g.connect(SH);o.onended=()=>rip(o,g);o.start(when);o.stop(when+step+.02);
  if(f>60&&st%2==0){const o2=AC.createOscillator();o2.type='square';o2.frequency.value=f*2;const g2=AC.createGain();
   g2.gain.setValueAtTime(.001,when);g2.gain.linearRampToValueAtTime(.1,when+.01);g2.gain.exponentialRampToValueAtTime(.001,when+step*.7);
   o2.connect(g2);g2.connect(MG);o2.onended=()=>rip(o2,g2);o2.start(when);o2.stop(when+step*.8+.02)}
  if(st%4==0){const ko=AC.createOscillator();ko.type='sine';const kg=AC.createGain();
   ko.frequency.setValueAtTime(130,when);ko.frequency.exponentialRampToValueAtTime(40,when+.12);
   kg.gain.setValueAtTime(.55,when);kg.gain.exponentialRampToValueAtTime(.001,when+.15);
   ko.connect(kg);kg.connect(MG);ko.onended=()=>rip(ko,kg);ko.start(when);ko.stop(when+.16)}
  if(st%8==4)noiz(.09,1800,1.4,.3);
  if(st%2==0)noiz(.025,8000,3,.1);
  st++}catch(e){}}
 musT=setInterval(()=>{try{if(AC.state==='suspended')AC.resume().catch(()=>{});while(next<AC.currentTime+.15){playStep(next);next+=step}}catch(e){}},45)}

// ---- game logic
function gy(e,v){return 285+cl(v,0,1)*109-26*e.s}
function mk(k,boss){const h=boss?40+wave*4:(k=='b'||wave>5?2:1);const e={k,boss,x:W+(boss?120:30),y:0,l:boss?.5:R(),s:boss?3.2:1,hp:h,mh:h,ph:R()*6,cd:1+R(),hx:470+R()*250,fl:0,armLt:1,armRt:1};e.y=gy(e,e.l);return e}
function nextWave(){wave++;banner=2.4;if(wave%5==0){E.push(mk(wave/5%2?'t':'b',1));mcd=5;toSpawn=0}else toSpawn=4+wave*2}
function reset(){P={x:110,y:200,hp:5,inv:0,fc:0,bx:80,by:236,walk:0,moving:false,slam:null,slamHit:false};E=[];PB=[];EB=[];PT=[];PP=[];PUD=[];SW=[];POW=null;powT=4;wave=0;score=0;spT=0;mcd=0;nextWave()}
function go(){ensureAudio();reset();S='play';try{if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().then(()=>{try{screen.orientation.lock('landscape')}catch(e){}}).catch(()=>{})}catch(e){}}
function pop(x,y,s){PT.push({x,y,s,l:.7,r:R()*.4-.2})}
function burst(x,y,k,n){for(let i=0;i<n;i++)PP.push({x,y,vx:R()*300-150,vy:R()*-260,l:.6,c:k=='t'?'#a8641f':'#f6d84a'})}
function hurt(){if(P.inv>0)return;P.hp--;P.inv=1.3;shake=.35;burst(P.x,P.y,'t',8);sHurt();
if(P.hp<=0){S='over';overT=t;if(score>best){best=score;try{localStorage.setItem('bm',best)}catch(e){}}}}
function kill(e){score+=e.boss?500:e.k=='b'?20:10;burst(e.x,e.y,e.k,e.boss?40:10);pop(e.x,e.y-20*e.s,e.boss?'K.O.!!':e.k=='t'?'CRUNCH!':'SPLAT!');
if(e.k=='t')sCrunch(e.boss);else sSplat(e.boss);
if(e.k=='b'){const n=e.boss?9:4;for(let i=0;i<n;i++)PUD.push({x:e.x+R()*26*e.s-13*e.s,y:e.y+18*e.s+R()*8,r:(6+R()*7)*e.s,l:3+R()})}
if(e.boss){P.hp=Math.min(5,P.hp+2);shake=.6}}
function shootArm(e){const canL=e.armLt>=1,canR=e.armRt>=1;if(!canL&&!canR)return;
const side=canL&&canR?(R()<.5?1:-1):(canL?1:-1),a=side==1?.5:-.5;
const wx=e.x+((side==1?-13:13)+16*Math.sin(a))*e.s,wy=e.y+(-6+16*Math.cos(a))*e.s;
const ang=Math.atan2(P.y-wy,P.x-wx);EB.push({x:wx,y:wy,vx:Math.cos(ang)*170,vy:Math.sin(ang)*170,k:'g'});
if(side==1)e.armLt=0;else e.armRt=0}
function shoot(e,n,sp,v,k){const a=Math.atan2(P.y-e.y,P.x-e.x);for(let i=0;i<n;i++){const q=a+(n>1?(i/(n-1)-.5)*2*sp:0);EB.push({x:e.x-e.s*18,y:e.y,vx:Math.cos(q)*v,vy:Math.sin(q)*v,k})}}

function up(dt){t+=dt;if(banner>0)banner-=dt;shake=Math.max(0,shake-dt);
let dx=(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0),dy=(keys.ArrowDown||keys.s?1:0)-(keys.ArrowUp||keys.w?1:0);
if(joy){dx+=cl((joy.x-joy.ox)/45,-1,1);dy+=cl((joy.y-joy.oy)/45,-1,1)}
const m=Math.hypot(dx,dy);if(m>1){dx/=m;dy/=m}
const mv=Math.hypot(dx,dy)>.05&&P.slam==null;P.moving=mv;P.walk+=dt*(mv?10:6);
if(P.slam==null){P.x=cl(P.x+dx*250*dt,24,400);P.y=cl(P.y+dy*250*dt,250,359)}
if(P.slam!=null){P.slam+=dt;
 if(P.slam>=.32&&!P.slamHit){P.slamHit=true;shake=.9;SW.push({x:P.slamX,y:P.slamY,r:14,l:.6});sPow();

 else{X.save();X.translate(b.x,b.y);X.rotate(Math.atan2(b.vy,b.vx)+t*0);X.beginPath();X.moveTo(-10,-2);X.lineTo(8,-2);X.lineTo(14,1);X.lineTo(-10,3);X.closePath();X.fillStyle='#d8dde6';X.fill();ol(2);X.restore()}});

X.restore();
// HUD

 const B=E.find(e=>e.boss);if(B){const nm='GIANT '+(B.k=='t'?'TOAST':'BLISTERY BUTTER');T(nm,W/2,26,24,'#fff');box(240,34,320,12,'#2a120c');box(240,34,320*B.hp/B.mh,12,B.k=='t'?'#c0501a':'#f6d84a')}

const rotMQ=matchMedia('(orientation:portrait)');
