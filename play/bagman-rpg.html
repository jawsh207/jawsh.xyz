<html lang="en">
<head>

<style>
:root{
  --bg:#e7e3ec; --panel:#d8d3e0; --edge:#bdb6c9; --ink:#1d1720; --muted:#5d5468;
  --screen:#0e0906; --pad:#2b2530; --btnA:#f0731f; --btnAd:#a3480f; --btnB:#2a7fc0; --btnBd:#174e7a; --pill:#6f6878;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#110d14;--panel:#1c1720;--edge:#2c2532;--ink:#efe6f5;--muted:#9a8fa6;--pad:#3a3240;--pill:#5a5262;}
}
:root[data-theme="dark"]{--bg:#110d14;--panel:#1c1720;--edge:#2c2532;--ink:#efe6f5;--muted:#9a8fa6;--pad:#3a3240;--pill:#5a5262;}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;
}
#console{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column}
/* top: the game screen */
#top{flex:0 1 auto;max-height:62%;min-height:0;display:flex;flex-direction:column;padding:10px 10px 4px}
#bezel{flex:0 1 auto;min-height:0;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--edge);border-radius:14px;padding:8px}
#gameWrap{flex:0 1 auto;aspect-ratio:512/400;width:100%;min-height:0;display:flex;align-items:center;justify-content:center}
canvas{display:block;border-radius:6px;background:var(--screen)}
.hint{color:var(--muted);font-size:11px;text-align:center;padding:6px 4px 0}
body.touch .hint{display:none}
/* bottom: controls */
#bottom{
  flex:1 1 auto;min-height:220px;position:relative;
  display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr auto;
  grid-template-areas:"dpad ab" "sys sys";padding:4px 18px clamp(28px,6vh,56px);
}
#dpadWrap{grid-area:dpad;display:flex;align-items:center;justify-content:center}
#abWrap{grid-area:ab;display:flex;align-items:center;justify-content:center}
#sysWrap{grid-area:sys;display:flex;justify-content:center;gap:26px;padding:2px 0 0}
#dpad{--s:clamp(120px,34vw,158px);width:var(--s);height:var(--s);position:relative;touch-action:none;cursor:pointer}
#dpad .arm{position:absolute;background:var(--pad);border-radius:8px}
#dpad .h{left:4%;right:4%;top:34%;height:32%}
#dpad .v{top:4%;bottom:4%;left:34%;width:32%}
#dpad .hub{position:absolute;left:42%;top:42%;width:16%;height:16%;border-radius:50%;background:rgba(255,255,255,.06);z-index:2}
#dpad .tri{position:absolute;z-index:2;width:0;height:0;border:7px solid transparent;opacity:.45}
#dpad .tU{left:50%;top:11%;margin-left:-7px;border-bottom-color:#fff;border-top:0}
#dpad .tD{left:50%;bottom:11%;margin-left:-7px;border-top-color:#fff;border-bottom:0}
#dpad .tL{top:50%;left:11%;margin-top:-7px;border-right-color:#fff;border-left:0}
#dpad .tR{top:50%;right:11%;margin-top:-7px;border-left-color:#fff;border-right:0}
#dpad.u .tU{opacity:1;border-bottom-color:#ffb21f}#dpad.d .tD{opacity:1;border-top-color:#ffb21f}
#dpad.l .tL{opacity:1;border-right-color:#ffb21f}#dpad.r .tR{opacity:1;border-left-color:#ffb21f}
#ab{position:relative;width:clamp(140px,38vw,176px);height:clamp(110px,30vw,136px)}
.gb{position:absolute;display:flex;flex-direction:column;align-items:center;gap:5px;width:44%}
.gb .gbtn{width:100%;aspect-ratio:1;border-radius:50%;border:none;touch-action:none;cursor:pointer;
  font:700 22px "Trebuchet MS",sans-serif;color:rgba(255,255,255,.92)}
#bA{background:var(--btnA);box-shadow:0 5px 0 var(--btnAd)}
#bB{background:var(--btnB);box-shadow:0 5px 0 var(--btnBd)}
.gb .gbtn.on{transform:translateY(4px)}
#bA.on{box-shadow:0 1px 0 var(--btnAd)}#bB.on{box-shadow:0 1px 0 var(--btnBd)}
.gb span{font-size:11px;font-weight:700;letter-spacing:1px;color:var(--muted)}
#gbB{left:0;bottom:0}
#gbA{right:0;top:0}
.sys{display:flex;flex-direction:column;align-items:center;gap:5px}
.pill{width:58px;height:16px;border-radius:9px;border:none;background:var(--pill);cursor:pointer;touch-action:none;padding:0}
.pill.on{transform:translateY(2px)}
.sys span{font-size:10px;font-weight:700;letter-spacing:1.5px;color:var(--muted)}
.gbtn:focus-visible,.pill:focus-visible{outline:3px solid #ffb21f;outline-offset:3px}
@media (orientation:landscape) and (max-height:520px){
  #console{max-width:none;flex-direction:row;position:relative}
  #top{order:2;flex:1 1 auto;max-height:none;padding:6px 4px}
  #bezel{flex:1}
  #gameWrap{flex:1;aspect-ratio:auto}
  #bottom{display:contents}
  #dpadWrap{order:1;flex:0 0 auto;width:clamp(150px,22vw,210px)}
  #abWrap{order:3;flex:0 0 auto;width:clamp(150px,22vw,210px);flex-direction:column}
  #sysWrap{position:absolute;left:0;bottom:14px;width:clamp(150px,22vw,210px);gap:14px;padding-left:14px}
}
</style>
</head>

let padsOK=false;

  const fp=document.permissionsPolicy||document.featurePolicy;
  const allowed=!(fp&&fp.allowsFeature)||fp.allowsFeature('gamepad');   // ask the policy first...
  padsOK=allowed&&typeof Navigator!=='undefined'&&'getGamepads' in Navigator.prototype; // ...then look, without touching navigator

function readPads(){
  GP.x=0;GP.y=0;GP.a=GP.b=GP.m=GP.st=false;
  if(!padsOK)return;
  let pads=[];try{pads=navigator.getGamepads()||[];}catch(e){padsOK=false;return;}
  for(const gp of pads){
    if(!gp||!gp.connected)continue;
    const bt=i=>!!(gp.buttons[i]&&(gp.buttons[i].pressed||gp.buttons[i].value>0.5));
    const ax=i=>{const v=gp.axes[i]||0;return Math.abs(v)<0.3?0:v;};   // dead zone so a resting stick doesn't drift
    let x=ax(0),y=ax(1);
    if(bt(14))x=-1;if(bt(15))x=1;if(bt(12))y=-1;if(bt(13))y=1;         // D-pad
    if(x||y){GP.x=x;GP.y=y;}
    if(bt(0))GP.a=true;                    // A / Cross: swing (hold for spin)
    if(bt(1)||bt(2))GP.b=true;             // B / Circle or X / Square: water gun
    if(bt(9))GP.st=true;                   // Start / Options: pause
    if(bt(8))GP.m=true;                    // Select / Back / Share / View: map
    if(GP.a||GP.b||GP.st||GP.m||x||y)GP.used=true;
  }
}

function pushBlock(h){

  else if(Math.abs(inp.y)>0.5&&Math.abs(inp.x)<0.5)dr=Math.sign(inp.y);
  else return;
  if(dc&&Math.sign(h.c*T+16-P.x)!==dc)return;
  if(dr&&Math.sign(h.r*T+16-(P.y-6))!==dr)return;
  if(time-P.pushLast>0.1)P.pushT=0;
  P.pushLast=time; P.pushT+=1/60;
  if(P.pushT<0.3)return;
  P.pushT=0;

  const tc=h.c+dc,tr=h.r+dr;
  if(tr<=0||tc<=0||tr>=ROWS-1||tc>=COLS-1)return;
  const dest=cur.grid[tr][tc];
  if(SOLID.has(dest)||dest==='D')return;
  if(cur.enemies.some(e=>!e.dead&&Math.floor(e.x/T)===tc&&Math.floor((e.y-6)/T)===tr))return;

function buildGrid(id,shut){
  const d=ROOMS[id], g=[];
  for(let r=0;r<ROWS;r++){const row=[];for(let c=0;c<COLS;c++){
    let ch='#';
    if(r>0&&r<ROWS-1&&c>0&&c<COLS-1){ch=d.map[r-1][c-1]; if(ch==='C'&&d.clearChest&&!S.flags['clear:'+id])ch='.';
      if(ch==='Q'&&S.flags['plates:'+id])ch='.';
      if(ch==='F'&&S.flags['fire:'+id+':'+c+','+r])ch='.';
      if(ch==='W'&&S.flags['crack:'+id+':'+c+','+r])ch='.';}
    row.push(ch);} g.push(row);}
  for(const s of d.exits){
    let t='.'; const lk=d.locks&&d.locks[s];
    if(lk==='L'&&!S.flags['door:'+id+s])t='L';
    else if(lk&&lk.indexOf('G:')===0&&!gateOpen(lk))t='G';
    else if(lk==='Q'&&!S.flags['plates:'+id])t='Q';
    else if(lk==='F'&&!S.flags['fire:'+pairKey(id,s)])t='F';
    else if(lk==='W'&&!S.flags['crack:'+pairKey(id,s)])t='W';
    if(shut&&t==='.')t='X';

}
function tileAt(c,r){if(!cur||r<0||r>=ROWS||c<0||c>=COLS)return null;return cur.grid[r][c];}
function solidP(c,r){const t=tileAt(c,r);return t!==null&&SOLID.has(t);}
function solidE(c,r){if(c<=0||r<=0||c>=COLS-1||r>=ROWS-1)return true;return SOLID.has(cur.grid[r][c]);}
function boxHit(x,y,hw,hh,fn){
  const c0=Math.floor((x-hw)/T),c1=Math.floor((x+hw-0.001)/T),r0=Math.floor((y-hh)/T),r1=Math.floor((y+hh-0.001)/T);
  for(let r=r0;r<=r1;r++)for(let c=c0;c<=c1;c++)if(fn(c,r))return {c,r};
  return null;
}
function moveAxis(o,d,axis,hw,hh,oy,fn){
  if(!d)return null; const steps=Math.ceil(Math.abs(d)), st=d/steps;
  for(let i=0;i<steps;i++){
    if(axis==='x')o.x+=st;else o.y+=st;
    const h=boxHit(o.x,o.y+oy,hw,hh,fn);
    if(h){if(axis==='x')o.x-=st;else o.y-=st;return h;}
  }
  return null;
}
function enterRoom(id,ex,ey){
  const d=ROOMS[id], prevArea=cur?cur.area:null, prevZone=cur?cur.d.zone:null;
  S.visited[id]=1;
  const bossAlive=!!(d.boss&&!S.flags[BOSS[d.boss].flag]);
  // every dungeon room with enemies locks its doors on the first visit, until it's been cleared once
  const lockable=d.area!=='city'&&d.area!=='store'&&!d.boss&&(d.en||[]).length>0;
  const shut=bossAlive||!!((d.shut||lockable)&&!S.flags['clear:'+id]);
  if(shut&&!bossAlive)after(0.35,()=>{if(cur&&cur.id===id&&cur.shut)fxText('DOORS LOCKED!',W/2,RH/2-50,22,'#ff8a5c','#ff2a1a');});
  cur={id,d,area:d.area,grid:buildGrid(id,shut),under:{},plates:[],enemies:[],proj:[],wshots:[],hazards:[],decals:[],drops:[],parts:[],fx:[],shut,intro:0,bg:null,bgDirty:true};
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)if(cur.grid[r][c]==='_')cur.plates.push([c,r]);
  P.x=ex;P.y=ey;P.ball.x=ex-10;P.ball.y=ey+2;P.atk=null;P.charge=0;P.kbx=P.kby=0;P.slip=0;P.dizzy=0;P.stuck=0;
  if(d.checkpoint||(prevArea&&prevArea!==d.area))S.cp={room:id,x:ex,y:ey};
  if(d.checkpoint&&S.water<Math.ceil(WM()/2))S.water=Math.ceil(WM()/2);
  for(const [t,c,r] of d.en||[])spawn(t,(c+1)*T+16,(r+1)*T+24);
  if(bossAlive){
    if(d.boss!=='stinky'&&!S.flags['cameo:'+d.boss])cur.cameo={x:W/2,y:3*T+26,phase:'wait',t:0,boss:d.boss};
    else spawnBoss(d.boss);
  }
  else if(prevArea!==d.area||(d.zone&&prevZone!==d.zone))showBanner(roomName(d),d.area==='city'?'CRUMB CITY':'',2);
  save();
}
function rebuild(){cur.grid=buildGrid(cur.id,cur.shut);cur.bgDirty=true;unstick();}
function unstick(){
  if(!boxHit(P.x,P.y-6,9,7,solidP))return;
  for(let rad=4;rad<100;rad+=4)for(let a=0;a<16;a++){
    const x=P.x+Math.cos(a*Math.PI/8)*rad,y=P.y+Math.sin(a*Math.PI/8)*rad;
    if(!boxHit(x,y-6,9,7,solidP)){P.x=x;P.y=y;return;}
  }
}

function circles(e){

    case 'francois':{const z=e.z||0;if(z>40)return [];return [[e.x,e.y-30-z,30]];}
    case 'tex':return [[e.x,e.y-20,22],[e.x,e.y-52,22]];
    case 'stinky':return [[e.x,e.y-14,15],[e.x,e.y-38,16],[e.x,e.y-62,13]];
    case 'spoon':{if(e.st==='rise'||e.st==='lock')return [];const z=e.z||0,sk=e.st==='stuck'?12:0;return [[e.x,e.y-26-z+sk,21],[e.x,e.y-60-z+sk,8],[e.x,e.y-84-z+sk,8]];}
    case 'toaster':return [[e.x-24,e.y-32,30],[e.x+24,e.y-32,30]];
    case 'slicer':return [[e.x-34,e.y-28,28],[e.x+34,e.y-28,28],[e.x-64,e.y-20,18],[e.x+64,e.y-20,18]];
    default:return [[e.x,e.y-e.hy,e.r]];
  }
}
function bossVulnerable(e){

  if(e.type==='toaster')return e.st==='hot';
  if(e.type==='spoon')return e.st==='stuck';
  if(e.type==='stinky')return e.clean>0||e.st==='dizzy';
  if(e.type==='slicer')return e.st==='open';
  if(e.type==='francois')return e.st==='soggy';
  if(e.type==='tex')return e.st==='reload'||e.st==='dizzy';

}
function updEnemies(dt){

function updatePlayer(dt){

  if(P.atk){P.atk.t+=dt;if(P.atk.t>=P.atk.dur)P.atk=null;}

function segDist(px,py,ax,ay,bx,by){const dx=bx-ax,dy=by-ay,l=dx*dx+dy*dy||1;const t=clamp(((px-ax)*dx+(py-ay)*dy)/l,0,1);return Math.hypot(px-(ax+dx*t),py-(ay+dy*t));}
function ballHits(){
  // the ball AND the chain both hurt; a spin hurts everything inside its circle
  const bx=P.ball.x,by=P.ball.y,br=10,spin=P.atk.type==='spin',dmg=(1+S.iron)*(spin?2:1);
  const h=handPos(P.x,P.y), cx=P.x, cy=P.y-10, R=chainLen()*1.1+br;
  const inside=(x,y,r)=>{
    if(Math.hypot(bx-x,by-y)<br+r)return true;                 // ball
    if(segDist(x,y,h.x,h.y,bx,by)<r+4)return true;              // chain
    if(spin)return Math.hypot(x-cx,(y-cy)/0.85)<R+r;            // whole spin circle
    return false;
  };
  for(const e of cur.enemies){
    if(e.dead||P.atk.hit.has(e)||cur.intro>0)continue;
    for(const [x,y,r] of circles(e)){
      if(inside(x,y,r)){P.atk.hit.add(e);hitEnemy(e,dmg,P.x,P.y);break;}
    }
  }
  for(const p of cur.proj){
    if(p.deflect&&p.type!=='lob'&&inside(p.x,p.y,p.r+2)){
      p.dead=true;SFX.clang();fxText('TINK!',p.x,p.y-10,16,'#ffffff','#9fb3c8');burst(p.x,p.y,['#ffffff','#ffd23f'],6,120,0);
    }
  }
  for(const [ox,oy] of [[0,0],[8,0],[-8,0],[0,8],[0,-8]])breakAt(bx+ox,by+oy);
  for(let i=1;i<4;i++)breakAt(h.x+(bx-h.x)*i/4,h.y+(by-h.y)*i/4);
  if(spin){const c0=Math.floor((cx-R)/T),c1=Math.floor((cx+R)/T),r0=Math.floor((cy-R)/T),r1=Math.floor((cy+R)/T);
    for(let r=r0;r<=r1;r++)for(let c=c0;c<=c1;c++){const x=c*T+16,y=r*T+16;if(Math.hypot(x-cx,(y-cy)/0.85)<R+8)breakAt(x,y);}}
}
function breakAt(px,py){
  const c=Math.floor(px/T),r=Math.floor(py/T);
  if(r<0||r>=ROWS||c<0||c>=COLS)return;

    if(P.atk&&P.atk.type==='spin')crack(c,r);
    else if(time-P.hintT>1.5){P.hintT=time;SFX.clang();fxText('NEEDS A SPIN!',c*T+16,r*T+4,15,'#ffffff','#9fb3c8');}

  }

  burst(c*T+16,r*T+16,['#a5713b','#6b4421','#d29a5a'],14,140,320);fxText('SMASH!',c*T+16,r*T+6,18);
  {const q=Math.random();if(q<0.3)cur.drops.push({type:'heart',x:c*T+16,y:r*T+20,life:9,t:0});else if(q<0.55)cur.drops.push({type:'water',x:c*T+16,y:r*T+20,life:9,t:0});else if(q<0.85)cur.drops.push({type:'crumb',v:Math.random()<0.3?5:1,x:c*T+16,y:r*T+20,life:9,t:0});}
}

function update(dt){

  if(game==='trans'){trans.t+=dt;if(trans.t>=trans.dur){game='play';trans=null;}return;}
  if(game==='fade'){

  if(game==='menu'){menuUpdate(dt);return;}

    if(inp.aP){dlg.i++;SFX.blip();if(dlg.i>=dlg.lines.length){const cb=dlg.cb;dlg=null;P.bumpCD=0.7;P.charge=0;if(cb)cb();}}
    return;
  }
  if(inp.mP){mapFromMenu=false;game='pause';SFX.blip();return;}
  if(inp.pP){openMenu();return;}
  S.time+=dt;
  if(stopT>0){stopT-=dt;return;}

  const due=later.filter(l=>l.t<=0); later=later.filter(l=>l.t>0); for(const l of due)l.fn();

  updatePlayer(dt); if(game!=='play')return;

  updProj(dt); updWater(dt); updHazards(dt); if(game!=='play')return;

function updParts(dt){
  if(!cur)return;

  for(const p of cur.parts){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.g*dt;p.vx*=0.97;} cur.parts=cur.parts.filter(p=>p.life>0);
  for(const f of cur.fx){f.t+=dt;f.y-=20*dt;} cur.fx=cur.fx.filter(f=>f.t<f.dur);
  for(const d of cur.drops){
    d.life-=dt;d.t+=dt;
    if(game==='play'&&Math.hypot(P.x-d.x,P.y-6-d.y)<18){d.life=0;
      if(d.type==='crumb'){S.crumbs=Math.min(999,S.crumbs+d.v);SFX.blip();fxText('+'+d.v,d.x,d.y-14,14,'#ffe14a','#b5703a');}

  }
  cur.drops=cur.drops.filter(d=>d.life>0);

}

    for(let r=0;r<14;r++)for(let c=0;c<16;c++){const x=c*T,y=r*T-8;if(r<6)drawWall('alley',c,r,x,y,null);else drawFloor('alley',c,r,x,y,null);}
    ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(0,6*T-8,W,10);
    ctx.save();ctx.globalAlpha=0.5;comicText('BAGMAN',420,150,26,'#e9e4f5','#b9b2d1',-0.12);ctx.restore();
    const vg=ctx.createRadialGradient(W/2,H/2,80,W/2,H/2,380);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.7)');ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
    ctx=saved;
  }
  ctx.drawImage(titleBG,0,0,W,H);
  const e={anim:time,st:'idle'};
  drawToast(108,350,2.2,e,'toast');
  // butter waddles in place (fake a tiny step each frame so its walk animation runs)
  const tb=titleButter; tb.anim=time+1; tb.lx=407.5; tb.ly=352; drawButter(408,352,2.2,tb,false);
  // Bagman marches in place, swinging his ball and chain
  const bx=256,by=362,sw=Math.sin(time*3.2), ballX=bx-62+sw*10, ballY=by+2-Math.abs(sw)*5;
  const wr=wrist(0,time*0.9,true);drawBall(ballX,ballY,by+8,false);drawChain(bx+wr.x*2.6,by+wr.y*2.6,ballX,ballY,false);
  drawBagman(bx,by,0,time*0.9,true,2.6);
  comicText('BAGMAN',W/2,62,78,'#ffe14a','#f0731f',-0.04);
  comicText('CRUST & CONSEQUENCE',W/2,114,26,'#ffffff','#ffd23f',0.02);
  const touch=document.body.classList.contains('touch');
  if(Math.floor(time*2)%2||true){
    ctx.fillStyle='rgba(0,0,0,.55)';rr(W/2-150,142,300,hasSave?50:30,6);ctx.fill();
    uiText((touch?'A':'Space')+': new game',W/2,157,14,Math.floor(time*2.5)%2?'#ffe14a':'#f1e2c6','center',true);
    if(hasSave)uiText((touch?'B':'M')+': continue from checkpoint',W/2,179,13,'#f1e2c6','center',true);
    if(isIOS()&&!isStandalone())uiText('Tip: tap Share > Add to Home Screen to play full screen',W/2,hasSave?204:184,11,'#bfe6ff','center',true);
  }
}
function drawDead(){
  ctx.fillStyle='rgba(60,4,0,'+Math.min(0.75,deadT)+')';ctx.fillRect(0,0,W,H);
  const s=Math.min(1,deadT*2);
  ctx.save();ctx.translate(W/2,H/2-30);ctx.scale(0.6+0.4*s,0.6+0.4*s);comicText('FLATTENED!',0,0,72,'#ffe14a','#f0731f',-0.05);ctx.restore();
  if(deadT>0.9){uiText('The breakfast won this round.',W/2,H/2+30,15,'#f1e2c6','center',true);uiText('Press A / Space to get back up',W/2,H/2+56,14,Math.floor(time*2.5)%2?'#ffe14a':'#f1e2c6','center',true);}
}
function drawWin(){
  ctx.fillStyle='#1a0e08';ctx.fillRect(0,0,W,H);
  for(let i=0;i<40;i++){const x=(hsh(i,1)*W+time*20*(hsh(i,2)-0.5)*4+W)%W,y=(hsh(i,3)*H+time*(40+hsh(i,4)*60))%H;ctx.fillStyle=i%3?'#a9652a':'#f6c945';ctx.fillRect(x,y,4,4);}
  comicText('CRUSHED &',W/2,60,52,'#ffe14a','#f0731f',-0.05);
  comicText('DEFEATED!',W/2,112,60,'#ffe14a','#f0731f',0.03);
  drawStinky(W/2-150,250,{anim:time,clean:true,dizzy:true});
  P.face=0;drawBagman(W/2,262,0,time,false,2.2);
  drawBall(W/2+60,268,272,false);drawChain(W/2-12.5*2.2,262-17*2.2,W/2+60,268,false);
  uiText('Stinky J got scrubbed, rinsed and hung out to dry.',W/2,292,14,'#f1e2c6','center',true);
  uiText('Crumb City smells like fresh bread again.',W/2,312,14,'#f1e2c6','center',true);
  const t=Math.floor(S.time),mm=Math.floor(t/60),ss=('0'+t%60).slice(-2);
  uiText('Time '+mm+':'+ss+'   Knockouts '+S.deaths+'   Hearts '+S.maxHp/2,W/2,342,13,'#e8b923','center',true);
  if(winT>2)uiText('Press A / Space to return to the title',W/2,372,13,Math.floor(time*2.5)%2?'#ffe14a':'#a8916f','center',true);
}

/* ================= RENDER ================= */
let HT=null;
function makeHalftone(){const h=document.createElement('canvas');h.width=h.height=6;const hc=h.getContext('2d');hc.fillStyle='#000';hc.beginPath();hc.arc(3,3,1.15,0,7);hc.fill();HT=ctx.createPattern(h,'repeat');}
function drawWorld(){
  for(const d of cur.decals){const al=Math.min(1,d.life/1.5);
    if(d.kind==='syrup'){ctx.fillStyle='rgba(181,101,29,'+(0.7*al)+')';ell(d.x,d.y,d.r,d.r*0.55);ctx.fill();ctx.fillStyle='rgba(255,210,122,'+(0.6*al)+')';ell(d.x-d.r*0.3,d.y-d.r*0.15,d.r*0.3,d.r*0.12);ctx.fill();}
    else if(d.kind==='jelly'){ctx.fillStyle='rgba(150,50,190,'+(0.6*al)+')';ell(d.x,d.y,d.r,d.r*0.55);ctx.fill();ctx.fillStyle='rgba(230,180,255,'+(0.5*al)+')';ell(d.x-d.r*0.3,d.y-d.r*0.15,d.r*0.3,d.r*0.12);ctx.fill();}
    else{ctx.fillStyle='rgba(214,160,40,'+(0.55*al)+')';ell(d.x,d.y,d.r,d.r*0.5);ctx.fill();}}
  if(P.stuck>0){ctx.strokeStyle='rgba(180,90,220,.8)';ctx.lineWidth=2;for(let i=0;i<3;i++){const a=time*4+i*2.1;line(P.x+Math.cos(a)*10,P.y-2,P.x+Math.cos(a)*13,P.y-12);}}
  for(const d of cur.drops){if(d.life<2&&Math.floor(d.t*10)%2)continue;shadowAt(d.x,d.y+6,6,2);const by=d.y-Math.abs(Math.sin(d.t*4))*4;if(d.type==='water')drawDrop(d.x,by,7);else if(d.type==='crumb')drawCrumb(d.x,by,d.v>1?7:5);else drawHeart(d.x,by,6,2);}
  for(const w of cur.wshots)drawWaterShot(w);
  drawHazards();
  if(cur.area==='city')drawExitHints();
  const ents=[{y:P.y,p:true}].concat(cur.enemies.map(e=>({y:e.y,e})));
  ents.sort((a,b)=>a.y-b.y);
  for(const o of ents){if(o.p)drawPlayerAt(P.x,P.y);else drawEnemy(o.e);}
  for(const p of cur.proj)drawProj(p);
  if(cur.cameo)drawStinky(cur.cameo.x,cur.cameo.y,{anim:time,walk:cur.cameo.phase==='flee',flee:cur.cameo.phase==='flee'});
  for(const p of cur.parts){ctx.globalAlpha=clamp(p.life/0.4,0,1);ctx.fillStyle=p.col;ctx.fillRect(p.x-p.size/2,p.y-p.size/2,p.size,p.size);}
  ctx.globalAlpha=1;
  for(const f of cur.fx){const k=f.t/f.dur,s=k<0.15?0.5+k/0.15*0.6:1.1-0.1*k;ctx.save();ctx.globalAlpha=k>0.7?(1-k)/0.3:1;ctx.translate(f.x,f.y);ctx.scale(s,s);comicText(f.text,0,0,f.size,f.c1,f.c2,f.rot);ctx.restore();}
}
function render(){
  ctx.setTransform(SC,0,0,SC,0,0);
  ctx.fillStyle='#0e0906';ctx.fillRect(0,0,W,H);
  if(game==='title'){drawTitle();overlay();return;}
  if(game==='win'){drawWin();overlay();return;}
  drawHUD();
  ctx.save();ctx.beginPath();ctx.rect(0,HUD,W,RH);ctx.clip();ctx.translate(0,HUD);
  if(shakeT>0)ctx.translate(rnd(-1,1)*shakeM,rnd(-1,1)*shakeM);
  if(game==='trans'&&trans){
    const k0=clamp(trans.t/trans.dur,0,1),k=k0<0.5?2*k0*k0:1-Math.pow(-2*k0+2,2)/2,D=DIRV[trans.dir];
    drawRoomBG(trans.old,-D[0]*W*k,-D[1]*RH*k);
    drawRoomBG(cur,D[0]*W*(1-k),D[1]*RH*(1-k));
    drawPlayerAt(lerp(trans.from.x,trans.ex,k),lerp(trans.from.y,trans.ey,k));
  }else if(game==='fade'&&trans){
    drawRoomBG(cur,0,0);drawWorld();
    const k=clamp(trans.t/trans.dur,0,1);ctx.fillStyle='rgba(0,0,0,'+(1-Math.abs(2*k-1))+')';ctx.fillRect(-20,-20,W+40,RH+40);
  }else{drawRoomBG(cur,0,0);drawWorld();}
  const vg=ctx.createRadialGradient(W/2,RH/2,RH*0.45,W/2,RH/2,RH*0.95);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,cur.area==='lair'?'rgba(60,0,0,.55)':'rgba(0,0,0,.4)');
  ctx.fillStyle=vg;ctx.fillRect(-20,-20,W+40,RH+40);
  ctx.restore();
  ctx.save();ctx.translate(0,HUD);drawBanner();if(game==='play'||game==='pause'||game==='menu')drawBossBars();ctx.restore();
  overlay();
  if(dlg&&game==='play')drawDialog();
  if(game==='pause')drawMap();
  if(game==='menu')drawMenu();
  if(game==='dead')drawDead();
}
function overlay(){if(!HT)makeHalftone();ctx.save();ctx.globalAlpha=0.07;ctx.fillStyle=HT;ctx.fillRect(0,0,W,H);ctx.restore();}

/* ================= LOOP & LAYOUT ================= */
let last=performance.now();
function frame(now){
  const dt=Math.min(0.05,Math.max(0,(now-last)/1000));last=now;
  readInput();update(dt);render();
  try{Music.update(musicFor());}catch(e){}
  requestAnimationFrame(frame);
}
const wrap=document.getElementById('gameWrap');
function fit(){
  const r=wrap.getBoundingClientRect(), s=Math.max(0.3,Math.min((r.width-6)/W,(r.height-6)/H));
  const cssW=Math.floor(W*s), cssH=Math.floor(H*s), dpr=Math.min(3,window.devicePixelRatio||1);
  cv.style.width=cssW+'px';cv.style.height=cssH+'px';
  cv.width=Math.round(cssW*dpr);cv.height=Math.round(cssH*dpr);
  SC=cv.width/W; titleBG=null; HT=null; if(cur)cur.bgDirty=true; if(trans&&trans.old)trans.old.bgDirty=true;
}
addEventListener('resize',fit);
if(window.visualViewport)visualViewport.addEventListener('resize',fit);

/* touch controls: Game Boy style */
const dpad=document.getElementById('dpad');
let padId=null;
function setTouch(){if(!document.body.classList.contains('touch')){document.body.classList.add('touch');requestAnimationFrame(fit);}}
try{if(matchMedia('(pointer: coarse)').matches)document.body.classList.add('touch');}catch(e){}
addEventListener('touchstart',setTouch,{passive:true});
function updPad(e){
  const r=dpad.getBoundingClientRect();const dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);
  let x=0,y=0;
  if(Math.hypot(dx,dy)>r.width*0.09){
    const a=Math.atan2(dy,dx),o=Math.round(a/(Math.PI/4));const s=((o%8)+8)%8;
    x=[1,1,0,-1,-1,-1,0,1][s]; y=[0,1,1,1,0,-1,-1,-1][s];
  }
  stick.x=x;stick.y=y;
  dpad.classList.toggle('u',y<0);dpad.classList.toggle('d',y>0);dpad.classList.toggle('l',x<0);dpad.classList.toggle('r',x>0);
}
dpad.addEventListener('pointerdown',e=>{e.preventDefault();padId=e.pointerId;try{dpad.setPointerCapture(e.pointerId);}catch(_){}updPad(e);ac();});
dpad.addEventListener('pointermove',e=>{if(e.pointerId===padId)updPad(e);});
const endPad=e=>{if(e.pointerId===padId){padId=null;stick.x=stick.y=0;dpad.className='';}};
['pointerup','pointercancel','lostpointercapture'].forEach(t=>dpad.addEventListener(t,endPad));
dpad.addEventListener('contextmenu',e=>e.preventDefault());
function bindBtn(el,set){
  el.addEventListener('pointerdown',e=>{e.preventDefault();try{el.setPointerCapture(e.pointerId);}catch(_){}set(true);el.classList.add('on');ac();});
  ['pointerup','pointercancel','lostpointercapture'].forEach(t=>el.addEventListener(t,()=>{set(false);el.classList.remove('on');}));
  el.addEventListener('contextmenu',e=>e.preventDefault());
}
bindBtn(document.getElementById('bA'),v=>{tA=v;});
bindBtn(document.getElementById('bB'),v=>{tB=v;});
bindBtn(document.getElementById('bStart'),v=>{tS=v;});
cv.addEventListener('pointerdown',e=>{
  ac();
  if(game==='menu'){const r=cv.getBoundingClientRect(),ly=(e.clientY-r.top)/r.height*H,i=Math.round((ly-MENU_Y0)/MENU_DY);if(i>=0&&i<MENU.length&&Math.abs(ly-(MENU_Y0+i*MENU_DY))<16){menuSel=i;menuActivate();}return;}
  if(game==='title'||game==='dead'||game==='win'||dlg){tA=true;setTimeout(()=>{tA=false;},90);}
});
const muteBtn=document.getElementById('mute');
bindBtn(muteBtn,v=>{tSel=v;});

if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)&&!/claude\.(ai|site)|claudeusercontent/.test(location.hostname)){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
window.__bag={get audio(){return [AC?AC.state:null,Music.step,Music.name];},spawn,get S(){return S;},get cur(){return cur;},P,ROOMS,enterRoom,update,render,newGame,setGame:g=>{game=g;},get game(){return game;},inp,K,get dlg(){return dlg;},clearDlg:()=>{dlg=null;}};
fit();
requestAnimationFrame(frame);
})();
</script>
