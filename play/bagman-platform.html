<title>Bagman: Breakfast Platformer</title>
<style>
:root{color-scheme:dark;--bg:#171210;--ink:#f3e6cf;--gold:#e8b83a;--red:#d63a2a;--panel:#3a2c1e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;height:100%;position:relative;overflow:hidden;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS",Verdana,sans-serif;user-select:none;-webkit-user-select:none;touch-action:none}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#hud{position:absolute;top:8px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start;font:900 18px 'Bangers',Impact,"Arial Black",sans-serif;letter-spacing:.04em;text-shadow:0 2px 0 #000;pointer-events:none}
#hl{display:flex;flex-direction:column;align-items:flex-start;gap:2px}
#hp{color:var(--red);letter-spacing:.08em}
#score{color:#ffd23a;font:400 21px 'Bangers',Impact,"Arial Black",sans-serif;letter-spacing:.07em;text-shadow:2px 2px 0 #000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000}
#wt{display:flex;align-items:center;gap:6px}
#wbar{display:block;width:80px;height:12px;border:2px solid #fff;border-radius:7px;overflow:hidden;background:#0008}
#wf{display:block;height:100%;background:#3ac7f0}
#pad,#act{position:absolute;bottom:16px;display:flex;gap:6px;align-items:flex-end}
#pad{left:10px}#act{right:10px}
#pad button,#act button{width:60px;height:60px;border-radius:50%;border:3px solid var(--ink);background:rgba(58,44,30,.8);color:#fff;font:900 12px 'Bangers',Impact,"Arial Black",sans-serif;touch-action:none;padding:0}
#pad{gap:8px}
#pad button{width:84px;height:84px;font-size:36px}
#act .j{width:84px;height:84px;font-size:17px}
button.on{background:var(--gold)!important;color:#000!important}
#btns{position:absolute;top:36px;right:12px;display:flex;gap:9px;z-index:5}
#mute,#pause{width:42px;height:42px;padding:0;display:flex;align-items:center;justify-content:center;border:3px solid #000;border-radius:50%;background:#ffd23a;box-shadow:3px 3px 0 #000;transform:rotate(-5deg)}
#pause{background:#ff5a3a;transform:rotate(5deg)}
#mute:active,#pause:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #000}
body.m #hud,body.m #pad,body.m #act,body.m #pause{display:none}
#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding:24px;text-align:center;background:rgba(15,10,8,.86);overflow-y:auto}
.w{margin:auto;display:flex;flex-direction:column;align-items:center;gap:12px;max-width:100%}
#ov.hide{display:none}
h1{margin:0;font:900 clamp(44px,13vw,88px)/.92 'Bangers',Impact,"Arial Black",sans-serif;color:var(--gold);text-shadow:4px 4px 0 #000;transform:rotate(-2deg)}
h1 small{display:block;font-size:.4em;color:var(--ink);margin-top:8px}
#ov p{margin:0;max-width:32ch;line-height:1.4;font-size:16px}
h2{margin:6px 0 0;font:900 16px 'Bangers',Impact,"Arial Black",sans-serif;letter-spacing:.06em;color:var(--gold)}
h1.s{font-size:clamp(34px,10vw,54px);transform:none}
.g{display:flex;gap:6px}
.l{width:58px;height:58px;border:3px solid var(--ink);border-radius:8px;background:var(--panel);color:#fff;font:900 17px 'Bangers',Impact,"Arial Black",sans-serif;padding:0;line-height:1.25}
.l small{display:block;font:11px "Trebuchet MS",sans-serif;color:var(--gold)}
.l:disabled{opacity:.4}
table{border-collapse:collapse;font-size:15px}td{padding:2px 14px}
.b.r{font-size:17px;background:var(--panel);padding:8px 22px}
.b{font:900 26px 'Bangers',Impact,"Arial Black",sans-serif;letter-spacing:.06em;padding:12px 40px;border:4px solid #000;border-radius:6px;background:var(--red);color:#fff;box-shadow:4px 4px 0 #000}
button.b:active{transform:translate(3px,3px);box-shadow:1px 1px 0 #000}
/* always landscape: on touch devices held in portrait, the whole game is turned sideways */
@media (orientation:portrait) and (pointer:coarse){
  body{position:fixed;top:0;left:0;width:100vh;width:100dvh;height:100vw;height:100dvw;transform:rotate(90deg) translateY(-100%);transform-origin:0 0}
}
</style></head><body oncontextmenu="return false">

<div id="hud"><div id="hl"><span id="hp"></span><span id="score"></span></div><span id="sc"></span><span id="wt"><b id="wl"></b><i id="wbar"><u id="wf"></u></i></span></div>
<div id="pad"><button data-k="VL">◀</button><button data-k="VR">▶</button></div>
<div id="act"><button data-k="VW">SQUIRT</button><button data-k="VS">SWING</button><button data-k="VJ" class="j">JUMP</button></div>
<div id="btns"><button id="mute" tabindex="-1"></button><button id="pause" tabindex="-1"></button></div>

<script>
// Tiny DOM shorthand, plus the canvas and its 2D drawing context used by everything below.
const $=i=>document.getElementById(i),cv=$('c'),ctx=cv.getContext('2d');
const HEAD='<svg viewBox="0 0 22 26" width="17" height="20" style="vertical-align:-4px;margin-left:5px"><rect x="1.5" y="2" width="19" height="22" fill="#b98a52" stroke="#2a1a0a" stroke-width="1.8"/><rect x="1.5" y="2" width="19" height="5" fill="#c99a5e" stroke="#2a1a0a" stroke-width="1.2"/><ellipse cx="7" cy="14" rx="3" ry="2.3" fill="#fff"/><ellipse cx="15" cy="14" rx="3" ry="2.3" fill="#fff"/><circle cx="7.6" cy="14.2" r="1.3" fill="#111"/><circle cx="15.6" cy="14.2" r="1.3" fill="#111"/><path d="M3 10L9 12.5M19 10L13 12.5" stroke="#2a1a0a" stroke-width="1.8" fill="none"/></svg>';let lastHud='';
const FONT="'Bangers',Impact,\"Arial Black\",sans-serif",GY=400,MAXW=50,SKYY=60;
// Draws a filled ellipse (used everywhere for shadows, eyes, food, etc).
const ell=(x,y,rx,ry,c)=>{ctx.fillStyle=c;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,7);ctx.fill()};
let VW,VH,K,DPR,ty,S,L,E,puddles,parts,shots,wells,P,lvl=1,score=0,state='title',cam=0,shake=0,T=0,banner=0,exitX=0,best=0,brick,fx=null,cur=1,area=0,LT=0,blobs=[],PL=0,PR=0,eagles=[],items=[],pops=[],comix=[],kills=0,fq=0,fd=6,lives=3,cpX=0,cpOn=false,note=null,zones=[];
const keys=new Set();
let prog={};try{prog=JSON.parse(localStorage.getItem('bagman-save'))||{}}catch(e){}

// Draws the small wobbling knife held by toast and butter (s = facing side, ph = animation phase).
function knife(s,ph,c){
  ctx.save();ctx.translate(s*13,-1);ctx.strokeStyle=c;ctx.lineWidth=3.5;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(s*5,-4);ctx.stroke();
  ctx.translate(s*5,-4);ctx.rotate(s*(.25+Math.sin(ph*1.3)*.3));ctx.fillStyle='#4a3a30';ctx.fillRect(-1.5,-7,3,9);
  ctx.fillStyle='#d7dde2';ctx.beginPath();ctx.moveTo(-2,-7);ctx.lineTo(2,-7);ctx.lineTo(2.5,-27);ctx.lineTo(-2,-25);ctx.fill();ctx.restore();
}
// Draws a pair of angled, angry eyebrows at height y.
function brows(y,c){ctx.strokeStyle=c;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-9,y-4);ctx.lineTo(-2,y);ctx.moveTo(9,y-4);ctx.lineTo(2,y);ctx.stroke()}
// Draws one toast enemy: legs, crust body, crumb texture, angry face, and its knife (regular or boss size).
function toast(e){
  const s=e.r/17;ctx.save();ctx.translate(e.x,e.y);ctx.scale(s,s);
  ell(0,21,15,4.5,'rgba(0,0,0,.35)');const st=Math.sin(e.ph)*3;
  ctx.fillStyle='#2b1408';ctx.fillRect(-9,13,5,8+st);ctx.fillRect(4,13,5,8-st);
  ctx.rotate(Math.sin(e.ph)*.05);
  ctx.fillStyle=e.fl>0?'#fff':e.big?'#4a2410':'#7a431f';ctx.strokeStyle='#2b1408';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(-14,16);ctx.lineTo(-14,-8);ctx.bezierCurveTo(-20,-22,-8,-24,0,-20);ctx.bezierCurveTo(8,-24,20,-22,14,-8);ctx.lineTo(14,16);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.fillStyle='rgba(30,12,4,.55)';for(const[x,y]of[[-8,-13],[7,-15],[-9,10],[9,8],[2,12]]){ctx.beginPath();ctx.arc(x,y,1.6,0,7);ctx.fill()}
  ell(-5,-6,3.2,2.4,'#ff2a1a');ell(5,-6,3.2,2.4,'#ff2a1a');brows(-9,'#160805');
  ctx.fillStyle='#160805';ctx.beginPath();ctx.moveTo(-8,3);ctx.quadraticCurveTo(0,12,8,3);ctx.closePath();ctx.fill();
  ctx.fillStyle='#f5ecd0';for(let i=-2;i<=2;i++){ctx.beginPath();ctx.moveTo(i*3.2-1.4,4.2);ctx.lineTo(i*3.2+1.4,4.2);ctx.lineTo(i*3.2,7.4);ctx.fill()}
  knife(e.side,e.ph,'#4a2a14');ctx.restore();
}
// Draws one butter enemy, including the melting drips and its mouth glowing before it spits.
function butter(e){
  ctx.save();ctx.translate(e.x,e.y);ctx.scale(e.r/15,e.r/15*(1+Math.sin(e.ph*2)*.05));
  ell(0,21,14,4.5,'rgba(0,0,0,.35)');
  ctx.fillStyle=e.fl>0?'#fff':'#f0c93a';ctx.strokeStyle='#8a6a10';ctx.lineWidth=2;
  ctx.beginPath();ctx.roundRect(-11,-17,22,32,6);ctx.fill();ctx.stroke();
  ell(-6,16,4,6+Math.sin(e.ph)*1.5,'#f0c93a');ell(4,17,3.2,8-Math.sin(e.ph)*1.5,'#f0c93a');
  ell(-4,-12,5,2.5,'rgba(255,240,150,.8)');ell(6,4,2.5,3,'rgba(255,240,150,.7)');
  ell(-5,-5,3.3,2.2,'#fff8d0');ell(5,-5,3.3,2.2,'#fff8d0');ell(-5+e.side,-5,1.4,1.4,'#222');ell(5+e.side,-5,1.4,1.4,'#222');
  brows(-8,'#5a4308');ell(-12,4,3.2,6,'#f0c93a');ell(12,4,3.2,6,'#f0c93a');

// Schedules one 16th-note step of the background music loop (bass note + optional melody note).
function playStep(s,t){
  const r=t-AC.currentTime,bar=s>>3,i=s&7,m=MEL[bar][i];

['pointerdown','keydown'].forEach(ev=>addEventListener(ev,()=>{initAudio();if(AC&&AC.state=='suspended')AC.resume()},true));
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();if(AC)document.hidden?AC.suspend():AC.resume()});

/* ---------- input ---------- */
const DIRK={KeyD:1,ArrowRight:1,VR:1,KeyA:-1,ArrowLeft:-1,VL:-1},lastTap={};
// Detects a double-tap on a direction key/button within 300ms to trigger the run-speed boost.
function tapDir(k){const d=DIRK[k];if(!d)return;const n=Date.now();if(lastTap[d]&&n-lastTap[d]<300&&P)P.run=d;lastTap[d]=n}
addEventListener('keydown',e=>{if(!e.repeat)tapDir(e.code);if(e.code=='Escape'||e.code=='KeyP'){state=='play'?pause():state=='pause'&&A.resume()}keys.add(e.code);if(e.code=='Space'||e.code.startsWith('Arrow'))e.preventDefault()});
addEventListener('keyup',e=>keys.delete(e.code));
document.querySelectorAll('#pad button,#act button').forEach(b=>{
  const k=b.dataset.k,u=()=>{keys.delete(k);b.classList.remove('on')};
  b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys.add(k);tapDir(k);b.classList.add('on')});
  b.addEventListener('pointerup',u);b.addEventListener('pointercancel',u);b.addEventListener('lostpointercapture',u);
});

/* ---------- level ---------- */
// Creates a fresh player-state object (position, health, ammo, timers) for a new run.
const mkP=()=>({x:80,y:GY-25,vx:0,vy:0,g:1,face:1,hp:5,inv:0,ammo:MAXW,sw:0,swc:0,wc:0,coy:0,jh:0,kb:0,walk:0,bx:0,by:0,sd:1});
// Spawns one enemy: t = 't'/'b'/'f' (toast/butter/flying toaster), s = its home platform, zone = patrol area for flyers.
function addE(t,x,s,big,zone){
  const r=big?34:t=='t'?16:t=='b'?14:24,f=t=='f'?0:21*r/(t=='t'?17:15);
  E.push({t,x,sf:s,big,r,foot:f,y:t=='f'?SKYY:s.y-f,hp:big?12+lvl*2:(t=='t'?3:t=='b'?4:4)+(lvl/8|0),sp:big?40:t=='t'?42+lvl*3:t=='b'?30+lvl*2:70+lvl*2,dir:Math.random()<.5?-1:1,side:1,kx:0,hc:0,fl:0,ph:Math.random()*6,pt:1,cd:1,wu:0,tt:0,th:0,eg:15,chg:0,cs:0,esc:0,blk:0,zone:zone||null,soak:0,sc:0,scT:0,vy:0});
}
// Builds a themed climb tower (stepping platforms) plus the flat attack platform at its top, for one zone.
function addClimb(zone){
  const ys=[330,255,180,140];let x=zone.x0-20;
  ys.forEach((y,i)=>{x+=(i%2?46:-10);S.push({x,w:60,y,kind:'step'})});
  S.push({x:zone.x0-10,w:(zone.x1-zone.x0)+20,y:SKYY,kind:'sky'});
}
// Generates a new level: platform layout, exit/checkpoint, water stations, enemies, and toaster climb zones.
function newLevel(){
  area=(lvl-1)/10|0;L=3600+lvl*240;fq=0;fd=6;S=[{x:0,w:L,y:GY}];let x=260,t=0;const tiers=[330,268,206];
  while(x<L-500){const w=100+Math.random()*90;S.push({x,w,y:tiers[t]});t=Math.max(0,Math.min(2,t+(Math.random()*3|0)-1));x+=w+40+Math.random()*70}
  exitX=L-120;wells=[];cpX=Math.round(L/2);cpOn=false;note=null;
  const gap=Math.max(VW+100,760),span=L-1000,n=Math.min(3+(lvl>9?1:0)+(lvl>19?1:0),(span/gap|0)+1);
  Array.from({length:n},()=>Math.random()*(span-(n-1)*gap)).sort((a,b)=>a-b).forEach((r,i)=>{const wx=500+r+i*gap,c=S.filter(s=>wx>s.x+20&&wx<s.x+s.w-20),s=c[Math.random()*c.length|0];wells.push({x:wx,y:s.y})});
  if(wells.some(w=>Math.abs(w.x-cpX)<110))cpX+=170;
  E=[];
  for(let i=0;i<Math.round(8+lvl*2.6);i++){
    const c=Math.random()<.5?[S[0]]:S.slice(1).filter(s=>s.x>450),s=c[Math.random()*c.length|0]||S[0];
    const x=s===S[0]?450+Math.random()*(L-800):s.x+30+Math.random()*(s.w-60);
    const r=Math.random();let t=r>1-Math.min(.5,.1+lvl*.035)?'b':'t';
    addE(t,x,s,false);
  }
  if(lvl%10==0)[['t'],['b'],['t','b']][area].forEach((t,j)=>addE(t,L-450-j*220,S[0],true));
  zones=[];
  if(lvl>=3){
    const zw=460,zgap=Math.max(2000,L/3.2|0);
    for(let zx=900;zx<L-700;zx+=zgap)zones.push({x0:zx,x1:Math.min(L-300,zx+zw)});
    if(!zones.length)zones.push({x0:Math.max(400,(L/2|0)-230),x1:Math.min(L-300,(L/2|0)+230)});
    zones.forEach(addClimb);
    let slots=2;
    zones.forEach(z=>{if(slots>0){addE('f',z.x0+40+Math.random()*(z.x1-z.x0-80),S[0],false,z);slots--}else fq++});
  }
  puddles=[];shots=[];parts=[];blobs=[];eagles=[];items=[];pops=[];comix=[];kills=0;cam=-PL;banner=2;Object.assign(P,{x:80,y:GY-25,vx:0,vy:0,g:1,inv:0,sw:0,sf:S[0]});
}
/* ---------- menus, progress, pause ---------- */

// Shows the title screen (Play / Scoreboard) with the how-to-play text.
function mainMenu(){state='menu';musicStop();panel('<h1>BAGMAN<small>Breakfast Platformer</small></h1>'+B('levels','PLAY')+B('score','SCOREBOARD')+'<p>SWING slams the ball and chain in front of you. SQUIRT fires the super soaker: refill it at wells, sinks and water dispensers. Butter puddles are slippery and butter spits: block it with the squirt gun. Jump on toast and butter to squash them. Flying toasters patrol high up and launch extra toast when they glow red; climb up to reach them, and empty a full water tank into one to short it out. Double-tap left or right to run faster. Every 5 defeats, a bald eagle delivers pizza when you are hurt; beating a boss brings a full meal when you are hurt.<br>A checkpoint flag waits at the middle of every level. You have 3 lives (shown as a Bagman head with the number left): lose all your hearts and you restart from the checkpoint.<br>Keys: A/D move, W jump, J swing, K squirt, P pause.</p>')}

// Shows the scoreboard: best score and stars per level, plus totals and a reset-save option.
function scoreMenu(){

    for(let j=1;j<=LPA;j++){const d=prog[i*LPA+j];if(d){tot+=d.s;st+=d.st}h+=`<tr><td>${i+1}-${j}</td><td>${d?stars(d.st):'—'}</td><td>${d?d.s:'—'}</td></tr>`}

// Begins playing level n. keep=true carries over current health/lives (used for "NEXT LEVEL"); otherwise it's a fresh run with full health and 3 lives.
function start(n,keep){cur=lvl=n;score=0;LT=0;const hp=keep&&P?P.hp:5;if(!keep)lives=3;P=mkP();P.hp=hp;newLevel();state='play';$('ov').className='hide';initAudio();musicStart()}

// Shows the game-over screen. Sends the player back to the area's first level unless they've already beaten that area's boss before.
function over(){
  state='over';musicStop();sfx.over();

// Shows the level-cleared screen: tallies score/stars, saves best results, and unlocks the next level/area.

// Maps every menu button's data-action name to the function it should call.
const A={levels:levelsMenu,score:scoreMenu,menu:mainMenu,start:v=>start(+v),next:()=>start(cur+1,true),retry:()=>start(cur),restart:()=>start(cur),

  snd(v,b){setMuted(!muted);b.textContent='SOUND: '+(muted?'OFF':'ON')},

let fsTried=0;
// On the very first tap, best-effort requests fullscreen and a landscape orientation lock.

  if(fsTried)return;fsTried=1;

// Finds whichever platform sits directly beneath world point (x,y); used to track "which floor is this enemy on".
function under(x,y){let b=S[0];for(const p of S)if(x>=p.x&&x<=p.x+p.w&&p.y>=y&&p.y<b.y)b=p;return b}

// Draws and flies one bald eagle delivery across the screen, dropping its food partway through.

// Starts a toaster's short-circuit sequence: sparking in place before it falls (see explode()).
function shortCircuit(e){if(e.sc)return;e.sc=1;e.scT=.5;e.tt=0;e.wu=0;sfx.short()}
// A short-circuited toaster's landing explosion: removes it, damages nearby enemies, shows the callout.
function explode(e){

// Damages the player by one heart and applies knockback/invulnerability (dx = direction of the hit).

// Damages an enemy by d, applies knockback/hit-flash, and handles its death/score/callout if it dies.

// The main per-frame simulation step: input, physics, combat, enemy AI, pickups, everything that changes state.

  const c=(...a)=>a.some(k=>keys.has(k));

  if(!jp&&P.vy<-220&&P.kb<=0)P.vy=-220;
  P.jh=jp;
  P.vy=Math.min(900,P.vy+1500*dt);P.x=Math.max(14,Math.min(L-14,P.x+P.vx*dt));

  if(P.sw>0){P.sw-=dt;if(P.sw<=0)P.swc=.2;else{

    const r=th*Math.PI/180;P.bx=P.x-P.sd*12+P.sd*R*Math.sin(r);P.by=P.y+6-R*Math.cos(r);
    if(el>=.38&&!P.sl){P.sl=1;shake=10;sfx.slam();fx={x:P.bx,y:P.y+25,t:0};
      puddles=puddles.filter(q=>Math.abs(q.x-P.bx)>70||Math.abs(q.y-(P.y+25))>10);

      for(const e of E)if(Math.abs(e.x-P.bx)<70+e.r&&Math.abs(e.y+e.foot-(P.y+25))<30)hurt(e,3,Math.sign(e.x-P.bx)||P.sd,340)}}}
  /* super soaker */
  if(c('KeyK','KeyX','VW')&&P.ammo<1&&P.wc<=0&&P.sw<=0){P.wc=.3;sfx.click()}
  if(c('KeyK','KeyX','VW')&&P.ammo>=1&&P.wc<=0&&P.sw<=0){P.wc=.09;P.ammo--;sfx.squirt();shots.push({x:P.x+P.face*26,y:P.y+3,vx:P.face*560+P.vx*.3,vy:(Math.random()-.5)*40,l:.55})}
  for(const b of shots){

  }

  for(const w of wells)if(Math.abs(P.x-w.x)<34&&Math.abs(P.y+25-w.y)<14&&P.ammo<MAXW){P.ammo=Math.min(MAXW,P.ammo+45*dt);P.rt=(P.rt||0)-dt;if(P.rt<=0){P.rt=.1;sfx.bubble()}if(Math.random()<.5)parts.push({x:w.x+(Math.random()-.5)*14,y:w.y-30,vx:(Math.random()-.5)*30,vy:-60,l:.5,c:'#7fd6ff',s:2.5})}

      if(mv){e.pt-=dt;if(e.pt<=0){e.pt=1;puddles.push({x:e.x,y:s.y,w:e.big?90:46,l:8});if(Math.abs(dx)<350)sfx.plop();if(puddles.length>40)puddles.shift()}}
    }
    if(fly&&e.esc>0)e.esc-=dt;
    let nx=e.x+(d*e.sp*(near?1.8:1)*mv+e.kx)*dt;const lo=fly?(e.zone?e.zone.x0+e.r:90):s.x+e.r*.6,hi=fly?(e.zone?e.zone.x1-e.r:L-90):s.x+s.w-e.r*.6;
    if(nx<lo||nx>hi){const atLo=nx<lo;nx=atLo?lo:hi;if(!near)e.dir=atLo?1:-1}
    let wallHit=false;
    if(fly){const hit=x=>S.some(p=>p.y<GY&&x+e.r>p.x&&x-e.r<p.x+p.w&&e.y+16>p.y&&e.y-24<p.y+16);
      if(e.esc<=0&&hit(nx)&&!hit(e.x)){nx=e.x;e.kx=0;wallHit=true;if(!near)e.dir=-e.dir}}
    if(fly){e.blk=wallHit?e.blk+dt:0;if(e.blk>.35){e.esc=1.1;e.blk=0}}
    e.x=nx;e.side=d;e.ph+=dt*e.sp/12;
    if(fly){
      const tgt=(e.esc>0?SKYY-70:SKYY)+Math.sin(e.ph*.5)*8;e.y+=(tgt-e.y)*Math.min(1,dt*(e.esc>0?5:2.4));
      if(near&&e.cd<=0&&e.tt<=0&&Math.abs(dx)<120&&Math.abs(P.y-e.y)<70){e.tt=.4;e.cd=1.3;sfx.stab()}

    if(P.sw>0&&P.el>=.22&&e.hc<=0&&Math.hypot(e.x-P.bx,e.y-P.by)<e.r+11)hurt(e,2,Math.sign(e.x-P.x)||1,300);

let last=0;
