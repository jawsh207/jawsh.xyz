const BASS=[110,87.31,130.81,82.41],MEL=[[0,null,3,5,7,null,5,3],[-4,null,0,3,8,null,3,0],[3,null,7,10,15,null,10,7],[7,null,11,14,12,11,7,null]];
function playStep(s,t){
  const r=t-AC.currentTime,bar=s>>3,i=s&7,m=MEL[bar][i];
  tone(BASS[bar]*[1,1,2,1,1,2,1,2][i],SD*.9,'triangle',.9,0,r,musG);
  if(m!=null)tone(440*2**(m/12),SD*.85,'square',.35,0,r,musG);
  if(i==0||i==4)tone(140,.12,'sine',1,40,r,musG);
  if(i==2||i==6)noise(.09,.35,1800,0,'bandpass',r,musG);
  noise(.03,.12,7000,0,'highpass',r,musG);
}
function musicStart(){if(!AC||mTimer)return;mStep=0;mNext=AC.currentTime+.1;mTimer=setInterval(()=>{while(mNext<AC.currentTime+.35){playStep(mStep,mNext);mNext+=SD;mStep=(mStep+1)&31}},80)}

  if(e.hp<=0&&!e.dead){e.dead=1;onKill(e);sfx[e.t=='b'?'killB':'killT']();
    if(e.t=='t'||e.t=='b')comix.push({x:e.x,y:e.y-e.r-10,txt:e.t=='t'?'KRUNCH!':'SPLAT!',c:e.t=='t',l:.7,rot:(Math.random()-.5)*.3});score+=e.big?100:e.t=='t'?10:e.t=='b'?15:30;shake=Math.max(shake,e.big?9:2);
    burst(e.x,e.y,e.t=='t'?['#7a431f','#c88a4a','#3b1e0d']:e.t=='b'?['#f5d04a','#ffe88a','#d9a92a']:['#c9d1d5','#5e676c','#ff5a3a'],e.big?30:12,e.t!='b')}
}

function update(dt){
  if(state!='play')return;
  banner-=dt;LT+=dt;const c=(...a)=>a.some(k=>keys.has(k));
  const ix=(c('KeyD','ArrowRight','VR')?1:0)-(c('KeyA','ArrowLeft','VL')?1:0);
  P.inv-=dt;P.kb-=dt;P.swc-=dt;P.wc-=dt;
  const onP=P.g&&puddles.some(p=>Math.abs(p.x-P.x)<p.w/2+4&&Math.abs(p.y-(P.y+25))<5);
  if(ix){P.face=ix;P.vx+=ix*(P.g?(onP?170:2400):1100)*dt}
  else if(P.g){const f=(onP?60:2400)*dt;P.vx=Math.abs(P.vx)<f?0:P.vx-Math.sign(P.vx)*f}
  if(P.run&&ix!=P.run)P.run=0;const m=(P.kb>0?320:170)*(P.sw>0?.45:1)*(P.run?1.35:1);P.vx=Math.max(-m,Math.min(m,P.vx));
  const jp=c('KeyW','ArrowUp','Space','VJ');P.coy=P.g?.1:P.coy-dt;
  if(jp&&!P.jh&&P.coy>0){P.vy=-570;P.coy=0;P.g=0;sfx.jump()}
  if(!jp&&P.vy<-220&&P.kb<=0)P.vy=-220;
  P.jh=jp;
  P.vy=Math.min(900,P.vy+1500*dt);P.x=Math.max(14,Math.min(L-14,P.x+P.vx*dt));
  const pb=P.y+25;P.y+=P.vy*dt;P.g=0;
  if(P.vy>=0)for(const s of S)if(P.x+8>s.x&&P.x-8<s.x+s.w&&pb<=s.y+1&&P.y+25>=s.y){if(P.vy>430)sfx.land();P.y=s.y-25;P.vy=0;P.g=1;P.sf=s;break}
  if(P.g)P.walk+=dt*Math.abs(P.vx)/170;
  /* ball and chain: only swings on attack */
  if(c('KeyJ','KeyZ','VS')&&P.sw<=0&&P.swc<=0){P.sw=.55;P.sd=P.face;P.sl=0;sfx.whoosh()}
  if(P.sw>0){P.sw-=dt;if(P.sw<=0)P.swc=.2;else{
    const el=P.el=.55-P.sw;let th=105,R=70;
    if(el<.22){const u=el/.22,q=1-(1-u)*(1-u);th=-160+100*q;R=22+48*q}else if(el<.38){const u=(el-.22)/.16;th=-60+165*u*u}
    const r=th*Math.PI/180;P.bx=P.x+P.sd*R*Math.sin(r);P.by=P.y-4-R*Math.cos(r);
    if(el>=.38&&!P.sl){P.sl=1;shake=10;sfx.slam();fx={x:P.bx,y:P.y+25,t:0};
      puddles=puddles.filter(q=>Math.abs(q.x-P.bx)>70||Math.abs(q.y-(P.y+25))>10);
      burst(P.bx,P.y+22,['#a89a80','#7a6f5c','#d8cdb4'],14,1);
      for(const e of E)if(Math.abs(e.x-P.bx)<70+e.r&&Math.abs(e.y+e.foot-(P.y+25))<30)hurt(e,3,Math.sign(e.x-P.bx)||P.sd,340)}}}
  /* super soaker */
  if(c('KeyK','KeyX','VW')&&P.ammo<1&&P.wc<=0&&P.sw<=0){P.wc=.3;sfx.click()}
  if(c('KeyK','KeyX','VW')&&P.ammo>=1&&P.wc<=0&&P.sw<=0){P.wc=.09;P.ammo--;sfx.squirt();shots.push({x:P.x+P.face*26,y:P.y+3,vx:P.face*560+P.vx*.3,vy:(Math.random()-.5)*40,l:.55})}
  for(const b of shots){
    b.x+=b.vx*dt;b.y+=b.vy*dt;b.vy+=260*dt;b.l-=dt;
    for(const e of E)if(!b.d&&!e.dead&&Math.abs(b.x-e.x)<e.r+3&&Math.abs(b.y-e.y)<e.r+(e.t=='f'?34:8)){b.d=1;hurt(e,.5,Math.sign(b.vx),90);sfx.splat();burst(b.x,b.y,['#7fd6ff','#fff'],3,0)}
    for(const q of blobs)if(!b.d&&q.l>0&&Math.hypot(b.x-q.x,b.y-q.y)<q.r+7){b.d=1;q.l=0;burst(q.x,q.y,['#f5d04a','#7fd6ff'],6,0);sfx.splat()}
    if(b.d||b.y>GY)b.l=0;
  }
  shots=shots.filter(b=>b.l>0);
  for(const w of wells)if(Math.abs(P.x-w.x)<34&&Math.abs(P.y+25-w.y)<14&&P.ammo<MAXW){P.ammo=Math.min(MAXW,P.ammo+45*dt);P.rt=(P.rt||0)-dt;if(P.rt<=0){P.rt=.1;sfx.bubble()}if(Math.random()<.5)parts.push({x:w.x+(Math.random()-.5)*14,y:w.y-30,vx:(Math.random()-.5)*30,vy:-60,l:.5,c:'#7fd6ff',s:2.5})}
  /* enemies: patrol their own platform, only react when the player is on it */
  for(const e of E){
    if(e.t=='f')e.sf=under(e.x,e.y+12);
    const s=e.sf,dx=P.x-e.x,fly=e.t=='f';const safe=fly&&P.g&&P.sf===S[0];let near=P.sf===s&&Math.abs(dx)<400&&!safe;
    if(fly){e.al=near?.6:(e.al||0)-dt;near=near||e.al>0}
    const d=near?(Math.sign(dx)||e.dir):e.dir;let mv=e.fall?0:1;
    e.kx*=Math.exp(-7*dt);e.hc-=dt;e.fl-=dt;e.cd-=dt;
    if(e.t=='b'){
      if(near&&Math.abs(dx)<150)mv=0;
      if(near&&Math.abs(dx)<170&&e.cd<=0&&e.wu<=0){e.wu=.45;e.cd=2.4}
      if(e.wu>0){mv=0;e.wu-=dt;if(e.wu<=0){const tt=Math.max(.15,Math.abs(dx)/240);blobs.push({x:e.x+d*e.r,y:e.y-4,vx:d*240,vy:(P.y-e.y+4)/tt-110*tt,l:2,r:e.big?10:6});sfx.spit()}}
      if(mv){e.pt-=dt;if(e.pt<=0){e.pt=1;puddles.push({x:e.x,y:s.y,w:e.big?90:46,l:8});if(Math.abs(dx)<350)sfx.plop();if(puddles.length>40)puddles.shift()}}
    }
    let nx=e.x+(d*e.sp*(near?1.8:1)*mv+e.kx)*dt;const lo=fly?90:s.x+e.r*.6,hi=fly?L-90:s.x+s.w-e.r*.6;
    if(nx<lo||nx>hi){const atLo=nx<lo;nx=atLo?lo:hi;if(!near)e.dir=atLo?1:-1}
    if(fly){const hit=x=>S.some(p=>p.y<GY&&x+e.r>p.x&&x-e.r<p.x+p.w&&e.y+16>p.y&&e.y-20<p.y+16);if(hit(nx)&&!hit(e.x)){nx=e.x;e.kx=0;if(!near)e.dir=-e.dir}}
    e.x=nx;e.side=d;e.ph+=dt*e.sp/12;
    if(fly){
      const capY=-ty+VH*.5,want=near?Math.max(s.y-150,Math.min(s.y-78,P.y-30)):e.hy+Math.sin(e.ph*.5)*10,tgt=Math.min(want,capY-8);e.y+=(tgt-e.y)*Math.min(1,dt*3);
      if(near&&e.cd<=0&&e.tt<=0&&Math.abs(dx)<120&&Math.abs(P.y-e.y)<70){e.tt=.4;e.cd=1.3;sfx.stab()}
      e.tt-=dt;e.th=e.tt>0?Math.sin(Math.PI*(1-e.tt/.4)):0;
      e.eg-=dt;e.chg=e.eg<2?1-e.eg/2:0;if(e.chg&&!e.cs){e.cs=1;if(Math.abs(dx)<700)sfx.charge()}
      if(e.eg<=0){e.eg=15;e.cs=0;e.chg=0;if(E.length<60)eject(e)}
      if(e.th>.4&&!safe&&P.inv<=0&&Math.abs(e.x+d*(35+e.th*34)*1.6-P.x)<14&&Math.abs(e.y+19-P.y)<44)hitP(dx);
    }else if(e.fall){e.vy+=1500*dt;e.y+=e.vy*dt;if(e.y>=s.y-e.foot){e.y=s.y-e.foot;e.fall=0}}else e.y=s.y-e.foot;
    if(P.sw>0&&P.el>=.22&&e.hc<=0&&Math.hypot(e.x-P.bx,e.y-P.by)<e.r+11)hurt(e,2,Math.sign(e.x-P.x)||1,300);
    if(!e.dead&&!fly&&P.vy>60&&Math.abs(P.x-e.x)<12+e.r*.8&&P.y+25>e.y-e.r*1.3&&P.y+25<e.y+e.r*.2){
      hurt(e,e.big?4:99,Math.sign(e.x-P.x)||1,e.big?150:0);P.vy=c('KeyW','ArrowUp','Space','VJ')?-540:-380;P.g=0;P.inv=Math.max(P.inv,.3);shake=Math.max(shake,4);
    }else if(!e.dead&&!safe&&P.inv<=0&&Math.abs(P.x-e.x)<10+e.r*.8&&Math.abs(P.y-e.y)<30+e.r*.4)hitP(dx);
  }
  E=E.filter(e=>e.hp>0);
  for(const b of blobs){
    b.x+=b.vx*dt;b.y+=b.vy*dt;b.vy+=220*dt;b.l-=dt;
    if(P.sw>0&&P.el>=.22&&Math.hypot(b.x-P.bx,b.y-P.by)<b.r+12){b.l=0;burst(b.x,b.y,['#f5d04a','#ffe88a'],6,0);sfx.splat()}
    else if(P.inv<=0&&Math.abs(b.x-P.x)<b.r+9&&Math.abs(b.y-P.y)<b.r+30){b.l=0;hitP(b.vx)}
    else if(b.y>GY-2){puddles.push({x:b.x,y:GY,w:44,l:6});b.l=0}
  }
  blobs=blobs.filter(b=>b.l>0);
  /* never more than 2 flying toasters exist at once, so never more than 2 on screen; extras queue up and fly in later from off-screen */
  if(fq>0&&E.filter(f=>f.t=='f').length<2){fd-=dt;if(fd<=0){const rx=cam+VW+160,lx=cam-160,x=rx<L-100?rx:lx>100?lx:0;if(x){addE('f',x,S[0],false);fq--;fd=10}else fd=2}}
  for(const g of eagles){
    g.x+=g.dir*250*dt;g.y+=g.vy*dt;g.life-=dt;
    if(!g.done){const tg=Math.max(P.sf.x+24,Math.min(P.sf.x+P.sf.w-24,P.x+P.face*70));
      if(g.dir>0?g.x>=tg:g.x<=tg){g.done=1;g.vy=-80;items.push({x:g.x,y:g.y+30,t:g.t,sf:P.sf,vy:0,on:0,ph:Math.random()*6})}}
  }
  eagles=eagles.filter(g=>g.life>0&&g.x>cam-220&&g.x<cam+VW+220);
  for(const it of items){
    if(!it.on){it.vy+=900*dt;it.y+=it.vy*dt;if(it.y>=it.sf.y){it.y=it.sf.y;it.on=1}}
    if(Math.abs(P.x-it.x)<28&&P.y+25>it.y-42&&P.y-36<it.y){
      it.got=1;P.hp=it.t==2?5:Math.min(5,P.hp+it.t+1);
      pops.push({x:it.x,y:it.y-50,txt:it.t==2?'FULL HEALTH!':'+'+(it.t+1)+' ♥',l:1.4});burst(it.x,it.y-20,['#f2b134','#ffe88a','#7fffa0'],12,0);sfx.eat();
    }
  }
  items=items.filter(it=>!it.got);
  for(const q of pops){q.y-=30*dt;q.l-=dt}pops=pops.filter(q=>q.l>0);
  for(const q of comix)q.l-=dt;comix=comix.filter(q=>q.l>0);
  for(const p of puddles)p.l-=dt;puddles=puddles.filter(p=>p.l>0);
  for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.95;p.vy=p.vy*.95+200*dt;p.l-=dt}parts=parts.filter(p=>p.l>0);
  if(fx){fx.t+=dt;if(fx.t>.25)fx=null}
  shake=Math.max(0,shake-dt*30);
  if(P.x>exitX-20&&state=='play')clear();
  cam+=(Math.max(-PL,Math.min(L-VW+PR,P.x-VW*.4))-cam)*Math.min(1,dt*6);
}

/* ---------- drawing ---------- */
function draw(){
  const X=DPR*K;ctx.setTransform(X,0,0,X,0,0);
  ctx.save();ctx.translate(-(cam*.5%64),0);ctx.fillStyle=pats[area];ctx.fillRect(0,0,VW+64,VH);ctx.restore();
  ctx.translate(-cam+(Math.random()-.5)*shake,ty+(Math.random()-.5)*shake);
  ctx.fillStyle='rgba(230,205,110,.55)';ctx.font='900 18px '+FONT;ctx.textAlign='left';ctx.fillText(['THE BAG','FRESH TOAST','DRY GOODS'][area],60,GY-130);
  const gc=GC[area];ctx.fillStyle=gc[0];ctx.fillRect(cam-10,GY,VW+20,400);ctx.fillStyle=gc[1];ctx.fillRect(cam-10,GY,VW+20,6);ctx.fillStyle=gc[2];
  for(let x=Math.floor(cam/80)*80;x<cam+VW+80;x+=80)ctx.fillRect(x,GY+6,3,400);
  for(const s of S)if(s.y<GY&&s.x<cam+VW&&s.x+s.w>cam){
    ctx.fillStyle='#6b4526';ctx.fillRect(s.x,s.y,s.w,16);ctx.fillStyle='#93673a';ctx.fillRect(s.x,s.y,s.w,4);ctx.fillStyle='#4a2e18';
    for(let x=s.x+34;x<s.x+s.w;x+=34)ctx.fillRect(x,s.y+4,2,12)}
  ctx.fillStyle='#e8b83a';ctx.fillRect(exitX-32,GY-104,64,104);ctx.fillStyle='#1f5a2e';ctx.fillRect(exitX-27,GY-99,54,99);ell(exitX+16,GY-48,3,3,'#e8b83a');
  ctx.fillStyle='#fff';ctx.font='900 16px '+FONT;ctx.textAlign='center';ctx.fillText('EXIT',exitX,GY-112);
  for(const w of wells)[well,sink,dispenser][area](w);
  for(const p of puddles){ctx.globalAlpha=Math.min(.75,p.l/1.5*.75);ell(p.x,p.y-2,p.w/2,4,'#f0cc3c');ell(p.x-6,p.y-3,6,1.5,'#fff2a0')}ctx.globalAlpha=1;
  if(fx){ctx.globalAlpha=1-fx.t/.25;ctx.strokeStyle='#e8d8b0';ctx.lineWidth=4;ctx.beginPath();ctx.ellipse(fx.x,fx.y-2,20+90*fx.t/.25,4+8*fx.t/.25,0,0,7);ctx.stroke();ctx.globalAlpha=1}
  for(const it of items){const b=it.on?Math.sin(T*4+it.ph)*3:0;ell(it.x,it.sf.y-2,15,3,'rgba(0,0,0,.25)');ctx.globalAlpha=.3+.12*Math.sin(T*5);ell(it.x,it.y-18-b,30,26,'#fff2a0');ctx.globalAlpha=1;food(it.t,it.x,it.y-6-b,1)}
  for(const e of E)({t:toast,b:butter,f:toaster})[e.t](e);
  for(const q of blobs){ell(q.x,q.y,q.r,q.r*.85,'#f0c93a');ell(q.x-q.r*.3,q.y-q.r*.3,q.r*.35,q.r*.25,'#fff2a0')}
  if(!(P.inv>0&&(T*20|0)%2)){ctx.save();ctx.translate(P.x,P.y+25);ctx.scale(1.12,1.12);ctx.translate(-P.x,-P.y-25);bag();if(P.sw<=0)gun();ctx.restore();ball()}
  for(const g of eagles)eagle(g);
  for(const q of comix)comicPop(q);
  ctx.textAlign='center';ctx.font='900 18px '+FONT;ctx.lineWidth=4;ctx.strokeStyle='#000';ctx.fillStyle='#7fffa0';for(const q of pops){ctx.globalAlpha=Math.min(1,q.l*2);ctx.strokeText(q.txt,q.x,q.y);ctx.fillText(q.txt,q.x,q.y)}ctx.globalAlpha=1;
  ctx.fillStyle='#7fd6ff';for(const b of shots){ctx.globalAlpha=.4+b.l;ctx.beginPath();ctx.arc(b.x,b.y,3,0,7);ctx.fill()}ctx.globalAlpha=1;
  for(const p of parts){ctx.globalAlpha=Math.min(1,p.l*2.5);ctx.fillStyle=p.c;p.sq?ctx.fillRect(p.x,p.y,p.s,p.s):(ctx.beginPath(),ctx.arc(p.x,p.y,p.s,0,7),ctx.fill())}ctx.globalAlpha=1;
  ctx.setTransform(X,0,0,X,0,0);
  if(state=='play'&&banner>0){ctx.globalAlpha=Math.min(1,banner*1.5);ctx.textAlign='center';ctx.font='900 48px '+FONT;ctx.lineWidth=6;ctx.strokeStyle='#000';ctx.fillStyle='#e8b83a';
    ctx.strokeText(lab(lvl)+'  '+AREAS[area],VW/2,VH*.3);ctx.fillText(lab(lvl)+'  '+AREAS[area],VW/2,VH*.3);
    if(lvl%LPA==0){ctx.font='900 20px '+FONT;ctx.fillStyle='#ff5a3a';ctx.strokeText('A BOSS GUARDS THE EXIT',VW/2,VH*.3+28);ctx.fillText('A BOSS GUARDS THE EXIT',VW/2,VH*.3+28)}ctx.globalAlpha=1}

  $('sc').textContent='LV '+lab(lvl)+'   '+score+'   🍕'+kills%5+'/5';$('wf').style.width=P.ammo/MAXW*100+'%';
  let n=null;for(const w of wells)if(!n||Math.abs(w.x-P.x)<Math.abs(n.x-P.x))n=w;
  $('wl').textContent=n?(Math.abs(n.x-P.x)<40?'💧':n.x<P.x?'◀ 💧':'💧 ▶'):'';
}

let last=0;
function loop(t){const dt=Math.min(.05,(t-last)/1000||0);last=t;T=t/1000;update(dt);draw();requestAnimationFrame(loop)}
resize();P=mkP();newLevel();banner=0;
mainMenu();
requestAnimationFrame(loop);
</script></body></html>
