<style>
:root{color-scheme:dark;--bg:#171210;--ink:#f3e6cf;--gold:#e8b83a;--red:#d63a2a;--panel:#3a2c1e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

        nx=nx>e.x?hz.x-hazHw(hz)-e.r:hz.x+hazHw(hz)+e.r;e.dir=-e.dir;
      }
    }
    e.x=nx;e.side=d;e.ph+=dt*e.sp/12;
    if((e.t=='t'||e.t=='b'||e.t=='g')&&!fly&&s===S[0]){
      const hz=hazards.find(h=>Math.abs(e.x-h.x)<hazHw(h)+e.r*.5);
      const vulnerable=hz&&(e.t!='g'||hz.type=='burner'); // egg only vulnerable to a burner, not molten butter
      if((vulnerable&&!e.dead)||e.dis>0){ // once it's started dying to a hazard there's no walking back out of it
        if(hz&&!e.hazT){e.hazT=hz.type;if(hz.type=='burner')sfx.sizzle()} // lock in which kind of hazard triggered this, for the right effect
        const fast=e.hazT=='burner',dur=fast?.6:1.5;
        e.dis+=dt;e.fl=.1;
        const fx=e.t=='t'?(fast?['#ff5a2a','#ffb02a','#fff2a0']:['#f0c93a','#fff2a0']):e.t=='b'?(fast?['#ffe88a','#fff','#c9eaff']:['#ffe88a','#fff2b0']):['#fff','#f5c518','#ffb02a'];
        if(e.dis>.1&&(e.dis*8)%1<dt*8)burst(e.x,e.y,fx,fast?3:2,0);
        if(e.dis>=dur&&!e.dead)hurt(e,999,e.side,0,true); // the hazard killed it, not the player — no reward
      }
    }
    if(fly){
      const tgt=(e.esc>0?TOASTY-70:TOASTY)+Math.sin(e.ph*.5)*8;e.y+=(tgt-e.y)*Math.min(1,dt*(e.esc>0?5:2.4));
      if(near&&e.cd<=0&&e.tt<=0&&Math.abs(dx)<120&&Math.abs(P.y-e.y)<70){e.tt=.4;e.cd=1.3;sfx.stab()}
      e.tt-=dt;e.th=e.tt>0?Math.sin(Math.PI*(1-e.tt/.4)):0;
      e.eg-=dt;e.chg=e.eg<2?1-e.eg/2:0;if(e.chg&&!e.cs){e.cs=1;if(Math.abs(dx)<700)sfx.charge()}
      if(e.eg<=0){e.eg=15;e.cs=0;e.chg=0;if(E.length<60)eject(e)}
      if(e.th>.4&&!safe&&P.inv<=0&&Math.abs(e.x+d*(35+e.th*34)*1.6-P.x)<14&&Math.abs(e.y+19-P.y)<44)hitP(dx);
    }else if(e.fall){e.vy+=1500*dt;e.y+=e.vy*dt;if(e.y>=s.y-e.foot){e.y=s.y-e.foot;e.fall=0}}else e.y=s.y-e.foot;
    if(P.sw>0&&P.el>=.22&&e.hc<=0&&Math.hypot(e.x-P.bx,e.y-P.by)<e.r+11)hurt(e,2,Math.sign(e.x-P.x)||1,300);
    if(!e.dead&&!fly&&P.vy>60&&Math.abs(P.x-e.x)<12+e.r*.8&&P.y+25>e.y-e.r*1.3&&P.y+25<e.y+e.r*.2){
      hurt(e,e.big?4:99,Math.sign(e.x-P.x)||1,e.big?150:0);P.vy=c('KeyW','ArrowUp','Space','VJ')?-540:-380;P.g=0;P.inv=Math.max(P.inv,.3);shake=Math.max(shake,4);
    }else if(!e.dead&&!safe&&P.inv<=0&&Math.abs(P.x-e.x)<10+e.r*.8&&Math.abs(P.y-e.y)<30+e.r*.4)hitP(dx);
  }
  // enemies can always walk past one another, but a gentle nudge keeps two on the same platform from
  // ever rendering stacked exactly on top of each other — capped small, so it never acts like a wall
  for(let i=0;i<E.length;i++){
    const a=E[i];if(a.dead||a.t=='f'||a.x<cam-450||a.x>cam+VW+450)continue;
    for(let j=i+1;j<E.length;j++){
      const b=E[j];if(b.dead||b.t=='f'||b.sf!==a.sf||b.x<cam-450||b.x>cam+VW+450)continue;
      const minD=(a.r+b.r)*.9,dx=b.x-a.x,ad=Math.abs(dx);
      // partial correction, not a full one — moving BOTH enemies means the gap closes twice as fast as
      // either one's own push, so correcting too much of the overlap turns this into a hard wall. Resolving
      // only part of it, per side, leaves steady two-sided pressure still winning through over about a second.
      if(ad<minD&&ad>.01){const push=Math.min(28*dt,(minD-ad)*.3)*(dx>=0?1:-1);a.x-=push;b.x+=push}
    }
  }
  E=E.filter(e=>e.hp>0);
  for(const b of blobs){
    b.x+=b.vx*dt;b.y+=b.vy*dt;b.vy+=220*dt;b.l-=dt;
    if(P.sw>0&&P.el>=.22&&Math.hypot(b.x-P.bx,b.y-P.by)<b.r+12){b.l=0;burst(b.x,b.y,['#f5d04a','#ffe88a'],6,0);sfx.splat()}
    else if(P.inv<=0&&Math.abs(b.x-P.x)<b.r+9&&Math.abs(b.y-P.y)<b.r+30){b.l=0;hitP(b.vx)}
    else if(b.y>GY-2){puddles.push({x:b.x,y:GY,w:44,l:6});b.l=0}
  }
  blobs=blobs.filter(b=>b.l>0);
  /* never more than 2 flying toasters exist at once, so never more than 2 on screen; extras queue up and fly in later from off-screen */
  if(fq>0&&E.filter(f=>f.t=='f').length<2&&zones.length){fd-=dt;if(fd<=0){
    const free=zones.filter(z=>!E.some(e=>e.t=='f'&&e.zone===z));
    if(free.length){const z=free[Math.random()*free.length|0];addE('f',z.x0+40+Math.random()*(z.x1-z.x0-80),S[0],false,z);fq--;fd=10}
    else fd=2; // every zone is already occupied right now; check again shortly
  }}
  for(const g of eagles){
    g.x+=g.dir*250*dt;g.y+=g.vy*dt;g.life-=dt;
    if(!g.done){const tg=Math.max(P.sf.x+24,Math.min(P.sf.x+P.sf.w-24,P.x+P.face*70));
      if(g.dir>0?g.x>=tg:g.x<=tg){g.done=1;g.vy=-80;items.push({x:g.x,y:g.y+30,t:g.t,sf:P.sf,vy:0,on:0,ph:Math.random()*6})}}
  }
  eagles=eagles.filter(g=>g.life>0&&g.x>cam-220&&g.x<cam+VW+220);
  for(const it of items){
    if(!it.on){it.vy+=900*dt;it.y+=it.vy*dt;if(it.y>=it.sf.y){it.y=it.sf.y;it.on=1}}
    if(Math.abs(P.x-it.x)<28&&P.y+25>it.y-42&&P.y-36<it.y){
      it.got=1;P.hp=it.t==2?5:Math.min(5,P.hp+it.t+1);
      pops.push({x:it.x,y:it.y-50,txt:it.t==2?'FULL HEALTH!':'+'+(it.t+1)+' ♥',l:1.4});burst(it.x,it.y-20,['#f2b134','#ffe88a','#7fffa0'],12,0);sfx.eat();
    }
  }
  items=items.filter(it=>!it.got);
  for(const q of pops){q.y-=30*dt;q.l-=dt}pops=pops.filter(q=>q.l>0);
  for(const q of comix)q.l-=dt;comix=comix.filter(q=>q.l>0);
  for(const p of puddles)p.l-=dt;puddles=puddles.filter(p=>p.l>0);
  for(const y of yolks)if(y.burn>0){y.burn-=dt;if(Math.random()<dt*10)parts.push({x:y.x+(Math.random()-.5)*14,y:y.y-4,vx:(Math.random()-.5)*8,vy:-30-Math.random()*20,l:.5,c:'rgba(90,70,40,.5)',s:2.5})}
  yolks=yolks.filter(y=>!y.burn||y.burn>0);
  for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.95;p.vy=p.vy*.95+200*dt;p.l-=dt}parts=parts.filter(p=>p.l>0);
  if(fx){fx.t+=dt;if(fx.t>.25)fx=null}
  shake=Math.max(0,shake-dt*30);
  if(P.x>exitX-20&&state=='play')clear();
  cam+=(Math.max(-PL,Math.min(L-VW+PR,P.x-VW*.4))-cam)*Math.min(1,dt*6);
}

  ctx.fillStyle='#e8b83a';ctx.fillRect(exitX-32,GY-104,64,104);ctx.fillStyle='#1f5a2e';ctx.fillRect(exitX-27,GY-99,54,99);ell(exitX+16,GY-48,3,3,'#e8b83a');

   ctx.fillStyle=cpOn?'#2fbf5a':'#c8382a';ctx.strokeStyle='#000';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(cpX+2,GY-92);ctx.quadraticCurveTo(cpX+22,GY-92+fw,cpX+44,GY-84+fw*1.4);ctx.quadraticCurveTo(cpX+22,GY-76+fw,cpX+2,GY-70);ctx.closePath();ctx.fill();ctx.stroke();
   if(cpOn){ctx.fillStyle='#fff';ctx.font='900 16px '+FONT;ctx.textAlign='center';ctx.fillText('✓',cpX+18,GY-78+fw*.6)}}
  for(const w of wells)[well,sink,dispenser][area](w);
  for(const p of puddles){ctx.globalAlpha=Math.min(.75,p.l/1.5*.75);ell(p.x,p.y-2,p.w/2,4,'#f0cc3c');ell(p.x-6,p.y-3,6,1.5,'#fff2a0')}ctx.globalAlpha=1;
  if(fx){ctx.globalAlpha=1-fx.t/.25;ctx.strokeStyle='#e8d8b0';ctx.lineWidth=4;ctx.beginPath();ctx.ellipse(fx.x,fx.y-2,20+90*fx.t/.25,4+8*fx.t/.25,0,0,7);ctx.stroke();ctx.globalAlpha=1}
  for(const it of items){const b=it.on?Math.sin(T*4+it.ph)*3:0;ell(it.x,it.sf.y-2,15,3,'rgba(0,0,0,.25)');ctx.globalAlpha=.3+.12*Math.sin(T*5);ell(it.x,it.y-18-b,30,26,'#fff2a0');ctx.globalAlpha=1;food(it.t,it.x,it.y-6-b,1)}
  for(const y of yolks)if(y.x>cam-30&&y.x<cam+VW+30)yolk(y);
  for(const e of E)if(e.x>cam-90&&e.x<cam+VW+90){
    ({t:toast,b:butter,f:toaster,c:bagel,g:egg})[e.t](e);
    if(e.t=='f'&&e.soak>0&&!e.sc){ // a straight meter below the toaster showing its short-circuit progress
      const p=Math.min(1,e.soak/SOAK_MAX),barY=e.y+e.r+14,hw=16;
      ctx.save();ctx.lineCap='round';
      ctx.strokeStyle='rgba(20,20,20,.5)';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(e.x-hw,barY);ctx.lineTo(e.x+hw,barY);ctx.stroke();

  ctx.textAlign='center';ctx.font='900 20px '+FONT;try{ctx.letterSpacing='.5px'}catch(e){}ctx.lineWidth=2.5;ctx.strokeStyle='#000';ctx.fillStyle='#7fffa0';for(const q of pops){ctx.globalAlpha=Math.min(1,q.l*2);ctx.strokeText(q.txt,q.x,q.y);ctx.fillText(q.txt,q.x,q.y)}ctx.globalAlpha=1;
  ctx.fillStyle='#7fd6ff';for(const b of shots){ctx.globalAlpha=.4+b.l;ctx.beginPath();ctx.arc(b.x,b.y,3,0,7);ctx.fill()}ctx.globalAlpha=1;

  {const str=n?(Math.abs(n.x-P.x)<40?'💧':n.x<P.x?'◀ 💧':'💧 ▶'):'';if(str!==lastWl){hudWl.textContent=str;lastWl=str}}
}

let last=0;
// The requestAnimationFrame driver: computes delta-time, then calls update() and draw() each frame.
// Gamepad support: maps the first connected controller onto the same virtual keys the on-screen
// touch buttons already use (VL/VR/VJ/VS/VW), so none of the movement/combat logic needs to change
// to understand it. Left stick or d-pad moves, A jumps, X swings, B/Y squirts, Start pauses/resumes.
// Full menu navigation reuses the browser's own focus system: d-pad/stick up-down moves real DOM
// focus between the panel's buttons (so the existing :focus ring shows the current selection), and
// A presses whichever button currently has focus — falling back to the first one if none does yet.
let gpStartHeld=false,gpAHeld=false,gpVertHeld=0;
let gpBlocked=false; // set once if the hosting page's permissions policy disallows the Gamepad API
// (e.g. when previewed inside a sandboxed iframe), so we don't keep retrying and throwing every frame
function pollGamepad(){
  if(gpBlocked||!navigator.getGamepads)return;
  let pads;
  try{pads=navigator.getGamepads()}catch(e){gpBlocked=true;return}
  const gp=pads&&pads[0];
  if(!gp)return;
  const dz=.3,ax=gp.axes[0]||0;
  const left=ax<-dz||!!gp.buttons[14]?.pressed,right=ax>dz||!!gp.buttons[15]?.pressed;
  left?keys.add('VL'):keys.delete('VL');
  right?keys.add('VR'):keys.delete('VR');
  const aBtn=!!gp.buttons[0]?.pressed; // jump
  aBtn?keys.add('VJ'):keys.delete('VJ');
  (!!gp.buttons[2]?.pressed)?keys.add('VS'):keys.delete('VS'); // swing
  (!!gp.buttons[1]?.pressed||!!gp.buttons[3]?.pressed)?keys.add('VW'):keys.delete('VW'); // squirt
  const startBtn=!!gp.buttons[9]?.pressed;
  if(startBtn&&!gpStartHeld){if(state=='play')pause();else if(state=='pause')A.resume()}
  gpStartHeld=startBtn;
  if(state!='play'){ // d-pad/stick up-down steps real focus between the current panel's buttons
    const vAx=gp.axes[1]||0,up=vAx<-dz||!!gp.buttons[12]?.pressed,down=vAx>dz||!!gp.buttons[13]?.pressed;
    const dir=up?-1:down?1:0;
    if(dir&&dir!==gpVertHeld){
      const btns=[...document.querySelectorAll('#ov button')];
      if(btns.length){let i=btns.indexOf(document.activeElement);if(i<0)i=0;btns[(i+dir+btns.length)%btns.length].focus()}
    }
    gpVertHeld=dir;
  }
  if(aBtn&&!gpAHeld&&state!='play'){
    goFS();initAudio();
    const act=document.activeElement;
    const b=(act&&act.matches&&act.matches('#ov button'))?act:document.querySelector('#ov button');
    if(b&&b.dataset.a)A[b.dataset.a](b.dataset.v,b);
  }
  gpAHeld=aBtn;
}
function loop(t){const dt=Math.min(.05,(t-last)/1000||0);last=t;T=t/1000;pollGamepad();update(dt);draw();requestAnimationFrame(loop)}
resize();P=mkP();newLevel();banner=0;
mainMenu();
requestAnimationFrame(loop);
