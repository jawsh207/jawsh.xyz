<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Fallopian Flap</title>
<style>
  :root{
    --cream:#f4ede0;
    --danger:#c93b3b;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;height:100%;overflow:hidden;
    background:#1a0505;
    font-family:Georgia, 'Times New Roman', serif;
    display:flex;align-items:center;justify-content:center;
  }
  #wrap{position:relative;width:100vw;height:100vh;max-width:480px;max-height:800px;}
  canvas{display:block;width:100%;height:100%;background:#3a0f0f;touch-action:none;}
  #hud{
    position:absolute;top:18px;left:0;right:0;text-align:center;
    color:var(--cream);font-size:38px;font-weight:bold;
    text-shadow:0 2px 0 #000, 0 0 12px rgba(0,0,0,.6);
    pointer-events:none;letter-spacing:1px;
  }
  #hud.hidden{display:none;}
  #muteBtn{
    position:absolute;top:16px;right:14px;z-index:5;
    width:38px;height:38px;border-radius:50%;border:none;
    background:rgba(0,0,0,.35);color:var(--cream);font-size:18px;
    cursor:pointer;display:flex;align-items:center;justify-content:center;
  }
  #overlay{
    position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;
    color:var(--cream);background:rgba(20,4,4,.75);
    padding:20px;
  }
  #overlay h1{
    font-size:clamp(26px,7vw,40px);margin:0 0 6px;color:var(--danger);
    text-shadow:0 3px 0 #000;
  }
  #overlay p{margin:4px 0;font-size:16px;opacity:.9;}
  #overlay .score-big{font-size:22px;margin-top:14px;color:var(--cream);}
  #startBtn{
    margin-top:22px;padding:14px 34px;font-size:18px;font-weight:bold;
    background:var(--danger);color:#1a0505;border:none;border-radius:30px;
    cursor:pointer;font-family:inherit;box-shadow:0 4px 0 #7a1e1e;
  }
  #startBtn:active{transform:translateY(3px);box-shadow:0 1px 0 #7a1e1e;}
</style>
</head>
<body>
<div id="wrap">
  <div id="hud" class="hidden">0</div>
  <button id="muteBtn" title="Toggle music">🔊</button>
  <canvas id="c"></canvas>
  <div id="overlay">
    <h1>Fallopian Flap</h1>
    <p>Tap / click / Space to swim up.</p>
    <div class="score-big" id="bestLine"></div>
    <button id="startBtn">Play</button>
  </div>
</div>
<script>
(function(){
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const hud = document.getElementById('hud');
  const overlay = document.getElementById('overlay');
  const startBtn = document.getElementById('startBtn');
  const bestLine = document.getElementById('bestLine');

  let W, H, DPR;
  function resize(){
    const wrap = document.getElementById('wrap');
    W = wrap.clientWidth; H = wrap.clientHeight;
    DPR = window.devicePixelRatio || 1;
    canvas.width = W*DPR; canvas.height = H*DPR;
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  window.addEventListener('resize', resize);
  resize();

  const GRAVITY = 1500;
  const FLAP_V = -420;
  const PIPE_W = 78;
  const GAP_BASE = 210;
  const GAP_MIN = 165;
  const SPEED_BASE = 155;
  const SPEED_MAX = 230;
  const SPAWN_BASE = 1600;
  const SPAWN_MIN = 1250;
  let GAP = GAP_BASE;
  let PIPE_SPEED = SPEED_BASE;
  let SPAWN_EVERY = SPAWN_BASE;

  function updateDifficulty(){
    const t = Math.min(1, score / 40);
    GAP = GAP_BASE - (GAP_BASE - GAP_MIN) * t;
    PIPE_SPEED = SPEED_BASE + (SPEED_MAX - SPEED_BASE) * t;
    SPAWN_EVERY = SPAWN_BASE - (SPAWN_BASE - SPAWN_MIN) * t;
  }

  let best = parseInt(localStorage.getItem('fallopianFlapBest')||'0',10) || 0;

  let sperm, pipes, score, running, over, lastSpawn, lastTime, tailPhase;

  // --- Audio: procedural squish/wet sounds ---
  let actx;
  function ensureAudio(){
    if (!actx){
      try { actx = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){ actx = null; }
    }
    if (actx && actx.state === 'suspended') actx.resume();
    if (actx && musicOn) startMusic();
  }
  function squishSound(kind){
    if (!actx) return;
    const now = actx.currentTime;

    if (kind === 'flap'){
      const dur = 0.22;
      const bufferSize = Math.floor(actx.sampleRate*dur);
      const buffer = actx.createBuffer(1, bufferSize, actx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i=0;i<bufferSize;i++){
        data[i] = Math.random()*2-1;
      }
      const noise = actx.createBufferSource();
      noise.buffer = buffer;

      const filter = actx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.Q.value = 6;
      filter.frequency.setValueAtTime(1100, now);
      filter.frequency.exponentialRampToValueAtTime(220, now+dur*0.85);

      const gain = actx.createGain();
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.5, now+0.015);
      gain.gain.exponentialRampToValueAtTime(0.18, now+0.07);
      gain.gain.exponentialRampToValueAtTime(0.4, now+0.12);
      gain.gain.exponentialRampToValueAtTime(0.001, now+dur);

      noise.connect(filter); filter.connect(gain); gain.connect(actx.destination);
      noise.start(now); noise.stop(now+dur);

      const osc = actx.createOscillator();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(150, now);
      osc.frequency.exponentialRampToValueAtTime(85, now+0.08);
      osc.frequency.exponentialRampToValueAtTime(120, now+0.13);
      osc.frequency.exponentialRampToValueAtTime(60, now+dur);
      const oGain = actx.createGain();
      oGain.gain.setValueAtTime(0.001, now);
      oGain.gain.exponentialRampToValueAtTime(0.22, now+0.02);
      oGain.gain.exponentialRampToValueAtTime(0.001, now+dur);
      osc.connect(oGain); oGain.connect(actx.destination);
      osc.start(now); osc.stop(now+dur);
      return;
    }

    if (kind === 'score'){
      const notes = [660, 990];
      notes.forEach((f, i) => {
        const start = now + i*0.07;
        const osc = actx.createOscillator();
        osc.type = 'sine';
        osc.frequency.value = f;
        const g = actx.createGain();
        g.gain.setValueAtTime(0.0001, start);
        g.gain.linearRampToValueAtTime(0.22, start+0.015);
        g.gain.exponentialRampToValueAtTime(0.001, start+0.22);
        osc.connect(g); g.connect(actx.destination);
        osc.start(start); osc.stop(start+0.22);
      });
      return;
    }

    const dur = 0.35;
    const bufferSize = Math.floor(actx.sampleRate*dur);
    const buffer = actx.createBuffer(1, bufferSize, actx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i=0;i<bufferSize;i++){
      const decay = 1 - i/bufferSize;
      data[i] = (Math.random()*2-1) * decay * decay;
    }
    const noise = actx.createBufferSource();
    noise.buffer = buffer;
    const filter = actx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(900, now);
    filter.frequency.exponentialRampToValueAtTime(120, now+dur);
    const gain = actx.createGain();
    gain.gain.setValueAtTime(0.5, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now+dur);
    noise.connect(filter); filter.connect(gain); gain.connect(actx.destination);
    noise.start(now); noise.stop(now+dur);

    const osc = actx.createOscillator();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(180, now);
    osc.frequency.exponentialRampToValueAtTime(72, now+dur*0.8);
    const oGain = actx.createGain();
    oGain.gain.setValueAtTime(0.25, now);
    oGain.gain.exponentialRampToValueAtTime(0.001, now+dur*0.8);
    osc.connect(oGain); oGain.connect(actx.destination);
    osc.start(now); osc.stop(now+dur*0.8);
  }

  // --- Background music ---
  let musicNodes = null;
  let musicTimer = null;
  let musicOn = true;
  const scale = [130.81,146.83,155.56,196.00,220.00,233.08];

  function startMusic(){
    if (!actx || musicNodes) return;
    const master = actx.createGain();
    master.gain.value = 0.16;
    master.connect(actx.destination);

    const padGain = actx.createGain();
    padGain.gain.value = 0.5;
    padGain.connect(master);

    const filter = actx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 500;
    filter.connect(padGain);

    const osc1 = actx.createOscillator();
    osc1.type = 'triangle'; osc1.frequency.value = 65.41;
    const osc2 = actx.createOscillator();
    osc2.type = 'triangle'; osc2.frequency.value = 65.41*1.005;
    osc1.connect(filter); osc2.connect(filter);
    osc1.start(); osc2.start();

    const lfo = actx.createOscillator();
    lfo.type = 'sine'; lfo.frequency.value = 0.08;
    const lfoGain = actx.createGain();
    lfoGain.gain.value = 220;
    lfo.connect(lfoGain); lfoGain.connect(filter.frequency);
    lfo.start();

    musicNodes = { master, padGain, filter, osc1, osc2, lfo };

    function pluck(){
      if (!musicOn || !actx) return;
      const now = actx.currentTime;
      const freq = scale[Math.floor(Math.random()*scale.length)] * (Math.random()<0.3 ? 2 : 1);
      const osc = actx.createOscillator();
      osc.type = 'sine';
      osc.frequency.value = freq;
      const g = actx.createGain();
      g.gain.setValueAtTime(0, now);
      g.gain.linearRampToValueAtTime(0.12, now+0.05);
      g.gain.exponentialRampToValueAtTime(0.001, now+1.8);
      const f = actx.createBiquadFilter();
      f.type = 'lowpass'; f.frequency.value = 1200;
      osc.connect(f); f.connect(g); g.connect(master);
      osc.start(now); osc.stop(now+1.8);

      musicTimer = setTimeout(pluck, 1400 + Math.random()*1800);
    }
    musicTimer = setTimeout(pluck, 800);
  }

  function stopMusic(){
    if (musicTimer) clearTimeout(musicTimer);
    musicTimer = null;
    if (musicNodes){
      try{
        musicNodes.osc1.stop(); musicNodes.osc2.stop(); musicNodes.lfo.stop();
      }catch(e){}
      musicNodes = null;
    }
  }

  let microbes = [];
  function initMicrobes(){
    microbes = [];
    for (let i=0;i<9;i++){
      microbes.push({
        type: Math.random() < 0.5 ? 'bacteria' : 'virus',
        x: Math.random()*W,
        y: Math.random()*H,
        s: 6 + Math.random()*7,
        speed: 12 + Math.random()*18,
        wobble: Math.random()*Math.PI*2,
        wspeed: 1+Math.random()*1.5,
        drift: (Math.random()-0.5)*10
      });
    }
  }

  function reset(){
    sperm = { x: W*0.28, y: H*0.4, vy: 0, r: 16, rot:0 };
    pipes = [];
    score = 0;
    running = false;
    over = false;
    lastSpawn = 0;
    tailPhase = 0;
    hud.textContent = '0';
    GAP = GAP_BASE; PIPE_SPEED = SPEED_BASE; SPAWN_EVERY = SPAWN_BASE;
    initMicrobes();
  }
  reset();

  function spawnPipe(){
    const margin = 70;
    const gapY = margin + Math.random()*(H - margin*2 - GAP);
    pipes.push({ x: W+PIPE_W, gapY, gap: GAP, passed:false });
  }

  function flap(){
    ensureAudio();
    if (over) return;
    if (!running){ running = true; overlay.style.display='none'; hud.classList.remove('hidden'); lastTime = performance.now(); requestAnimationFrame(loop); }
    sperm.vy = FLAP_V;
    squishSound('flap');
  }

  function endGame(){
    if (!over) squishSound('hit');
    over = true; running = false;
    if (score > best){ best = score; localStorage.setItem('fallopianFlapBest', best); }
    bestLine.textContent = 'Score: ' + score + '   Best: ' + best;
    startBtn.textContent = 'Play Again';
    overlay.style.display = 'flex';
  }

  function rectCircleColl(cx,cy,cr, rx,ry,rw,rh){
    const nx = Math.max(rx, Math.min(cx, rx+rw));
    const ny = Math.max(ry, Math.min(cy, ry+rh));
    const dx = cx-nx, dy = cy-ny;
    return (dx*dx+dy*dy) < cr*cr;
  }

  // --- Drawing: sperm ---
  function drawSperm(t){
    ctx.save();
    ctx.translate(sperm.x, sperm.y);
    ctx.rotate(sperm.rot*0.4);

    ctx.fillStyle='rgba(0,0,0,.2)';
    ctx.beginPath(); ctx.ellipse(2,20,16,5,0,0,Math.PI*2); ctx.fill();

    const wag = Math.sin(t*14)*10;
    ctx.strokeStyle = '#f4ede0';
    ctx.lineWidth = 7;
    ctx.lineCap='round';
    ctx.beginPath();
    ctx.moveTo(-14, 0);
    ctx.quadraticCurveTo(-30, wag, -46, wag*0.3);
    ctx.stroke();
    ctx.lineWidth=4;
    ctx.strokeStyle='rgba(200,190,170,.6)';
    ctx.beginPath();
    ctx.moveTo(-14,0);
    ctx.quadraticCurveTo(-30,wag,-46,wag*0.3);
    ctx.stroke();

    const grad = ctx.createRadialGradient(-4,-4,2,0,0,17);
    grad.addColorStop(0,'#ffffff');
    grad.addColorStop(1,'#e6ddc8');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(0,0,16,0,Math.PI*2);
    ctx.fill();
    ctx.strokeStyle='rgba(150,140,120,.4)';
    ctx.lineWidth=1.5;
    ctx.stroke();

    ctx.fillStyle='#2a2418';
    ctx.beginPath(); ctx.arc(5,-4,2,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(9,-1,2,0,Math.PI*2); ctx.fill();

    ctx.restore();
  }

  // --- organ obstacle segments ---
  function drawOrganPipe(x, gapY, seed, GAP){
    ctx.save();
    const topGrad = ctx.createLinearGradient(x,0,x,gapY);
    topGrad.addColorStop(0,'#7a2b2b');
    topGrad.addColorStop(1,'#b5453a');
    ctx.fillStyle = topGrad;
    roundedBlob(x,0,PIPE_W,gapY,seed,true);
    ctx.fill();
    ctx.strokeStyle='#4a1414'; ctx.lineWidth=2; ctx.stroke();

    ctx.strokeStyle='rgba(255,180,160,.35)';
    ctx.lineWidth=3;
    for(let i=0;i<3;i++){
      ctx.beginPath();
      ctx.moveTo(x+10, gapY*0.2 + i*gapY*0.25);
      ctx.quadraticCurveTo(x+PIPE_W/2, gapY*0.2 + i*gapY*0.25 + 10, x+PIPE_W-10, gapY*0.2 + i*gapY*0.25);
      ctx.stroke();
    }

    const by = gapY+GAP;
    const botGrad = ctx.createLinearGradient(x,by,x,H);
    botGrad.addColorStop(0,'#b5453a');
    botGrad.addColorStop(1,'#7a2b2b');
    ctx.fillStyle = botGrad;
    roundedBlob(x,by,PIPE_W,H-by,seed+1,false);
    ctx.fill();
    ctx.strokeStyle='#4a1414'; ctx.lineWidth=2; ctx.stroke();

    ctx.strokeStyle='rgba(255,180,160,.35)';
    ctx.lineWidth=3;
    for(let i=0;i<3;i++){
      const yy = by + (H-by)*0.25 + i*(H-by)*0.22;
      ctx.beginPath();
      ctx.moveTo(x+10, yy);
      ctx.quadraticCurveTo(x+PIPE_W/2, yy-10, x+PIPE_W-10, yy);
      ctx.stroke();
    }
    ctx.restore();
  }

  function roundedBlob(x,y,w,h, seed, isTop){
    ctx.beginPath();
    const bumpSide = isTop ? y+h : y;
    const bumps = 6;
    if (isTop){
      ctx.moveTo(x,y);
      ctx.lineTo(x+w,y);
      ctx.lineTo(x+w, y+h-10);
      for(let i=bumps;i>=0;i--){
        const bx = x + (w/bumps)*i;
        const bump = 8 + 6*Math.abs(Math.sin(seed*3+i*1.7));
        ctx.lineTo(bx, y+h-10+bump*Math.sin(i));
      }
      ctx.lineTo(x, y+h-10);
      ctx.closePath();
    } else {
      ctx.moveTo(x, y+h);
      ctx.lineTo(x+w, y+h);
      ctx.lineTo(x+w, y+10);
      for(let i=0;i<=bumps;i++){
        const bx = x + (w/bumps)*i;
        const bump = 8 + 6*Math.abs(Math.sin(seed*3+i*1.7));
        ctx.lineTo(bx, y+10-bump*Math.sin(i));
      }
      ctx.lineTo(x, y+10);
      ctx.closePath();
    }
  }

  function drawBackground(t){
    ctx.save();
    ctx.fillStyle='rgba(255,220,200,.15)';
    for(let i=0;i<14;i++){
      const px = (i*67 + t*20) % W;
      const py = (i*113) % H;
      ctx.beginPath(); ctx.arc(px,py, 2+ (i%3), 0, Math.PI*2); ctx.fill();
    }
    ctx.restore();
    drawMicrobes(t);
  }

  function updateMicrobes(dt){
    for (const m of microbes){
      m.x -= m.speed*dt;
      m.wobble += m.wspeed*dt;
      m.y += Math.sin(m.wobble)*m.drift*dt;
      if (m.x < -20){
        m.x = W+20;
        m.y = Math.random()*H;
        m.type = Math.random() < 0.5 ? 'bacteria' : 'virus';
      }
    }
  }

  function drawMicrobes(t){
    ctx.save();
    for (const m of microbes){
      ctx.save();
      ctx.translate(m.x, m.y);
      ctx.globalAlpha = 0.45;
      if (m.type === 'bacteria'){
        ctx.rotate(Math.sin(m.wobble*0.5)*0.4);
        ctx.fillStyle = '#8fbf5a';
        ctx.strokeStyle = '#517a2e';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.ellipse(0,0, m.s*1.8, m.s*0.7, 0, 0, Math.PI*2);
        ctx.fill(); ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(m.s*1.8, 0);
        ctx.quadraticCurveTo(m.s*2.6, Math.sin(t*6)*4, m.s*3.4, 0);
        ctx.strokeStyle='rgba(81,122,46,.6)';
        ctx.stroke();
      } else {
        ctx.fillStyle = '#7fb8c9';
        ctx.strokeStyle = '#3d6a76';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(0,0,m.s,0,Math.PI*2);
        ctx.fill(); ctx.stroke();
        const spikes = 8;
        ctx.strokeStyle = '#3d6a76';
        for (let i=0;i<spikes;i++){
          const ang = (i/spikes)*Math.PI*2 + m.wobble*0.3;
          const x1 = Math.cos(ang)*m.s, y1 = Math.sin(ang)*m.s;
          const x2 = Math.cos(ang)*(m.s+4), y2 = Math.sin(ang)*(m.s+4);
          ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
          ctx.beginPath(); ctx.arc(x2,y2,1.5,0,Math.PI*2); ctx.fill();
        }
      }
      ctx.restore();
    }
    ctx.restore();
  }

  function update(dt){
    updateMicrobes(dt);
    sperm.vy += GRAVITY*dt;
    sperm.y += sperm.vy*dt;
    sperm.rot = Math.max(-0.5, Math.min(1.3, sperm.vy/500));

    if (sperm.y - sperm.r < 0){ sperm.y = sperm.r; sperm.vy = 0; }
    if (sperm.y + sperm.r > H){ endGame(); return; }

    lastSpawn += dt*1000;
    if (lastSpawn > SPAWN_EVERY){ spawnPipe(); lastSpawn = 0; }

    for (const p of pipes){
      p.x -= PIPE_SPEED*dt;
      if (!p.passed && p.x+PIPE_W < sperm.x){ p.passed = true; score++; hud.textContent = score; updateDifficulty(); squishSound('score'); }
      if (rectCircleColl(sperm.x,sperm.y,sperm.r-4, p.x,0,PIPE_W,p.gapY) ||
          rectCircleColl(sperm.x,sperm.y,sperm.r-4, p.x,p.gapY+p.gap,PIPE_W,H-(p.gapY+p.gap))){
        endGame();
      }
    }
    pipes = pipes.filter(p => p.x > -PIPE_W-10);
  }

  function render(t){
    ctx.clearRect(0,0,W,H);
    const g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#2b0a0a'); g.addColorStop(1,'#4a1414');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    drawBackground(t);
    let seed=0;
    for (const p of pipes){ drawOrganPipe(p.x, p.gapY, seed, p.gap); seed+=0.7; }
    drawSperm(t);
  }

  function loop(now){
    if (!running) return;
    const dt = Math.min(0.033, (now-lastTime)/1000);
    lastTime = now;
    update(dt);
    render(now/1000);
    if (running) requestAnimationFrame(loop);
  }

  document.getElementById('muteBtn').addEventListener('click', (e) => {
    e.stopPropagation();
    musicOn = !musicOn;
    document.getElementById('muteBtn').textContent = musicOn ? '🔊' : '🔇';
    if (musicOn) ensureAudio(); else stopMusic();
  });

  canvas.addEventListener('pointerdown', flap);
  window.addEventListener('keydown', e => { if (e.code==='Space'){ e.preventDefault(); flap(); }});
  startBtn.addEventListener('click', () => {
    ensureAudio();
    reset();
    overlay.style.display='none';
    hud.classList.remove('hidden');
    running = true;
    lastTime = performance.now();
    requestAnimationFrame(loop);
  });

  hud.classList.add('hidden');
  render(0);
  if (best>0) bestLine.textContent = 'Best: ' + best;
})();
</script>
</body>
</html>
