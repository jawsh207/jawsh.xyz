<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Fallopian Flap</title>
<style>
  :root{
    --cream:#f4ede0;
    --danger:#c93b3b;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;height:100%;overflow:hidden;
    background:#1a0505;
    font-family:Georgia, 'Times New Roman', serif;
    display:flex;align-items:center;justify-content:center;
  }
  #wrap{position:relative;width:100vw;height:100vh;max-width:480px;max-height:800px;}
  canvas{display:block;width:100%;height:100%;background:#3a0f0f;touch-action:none;}
  #hud{
    position:absolute;top:18px;left:0;right:0;text-align:center;
    color:var(--cream);font-size:38px;font-weight:bold;
    text-shadow:0 2px 0 #000, 0 0 12px rgba(0,0,0,.6);
    pointer-events:none;letter-spacing:1px;
  }
  #hud.hidden{display:none;}
  #hud .now{font-size:38px;line-height:1;}
  #hud .best{font-size:13px;letter-spacing:2px;opacity:.75;margin-top:6px;font-weight:normal;}
  #hud .best.beat{color:#ffb4a0;opacity:1;}
  #overlay .score-big{line-height:1.5;}
  #overlay .newbest{color:#ffb4a0;font-weight:bold;font-size:16px;letter-spacing:2px;}
  #overlay{
    position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;
    color:var(--cream);background:rgba(20,4,4,.75);
    padding:20px;
  }
  #overlay h1{
    font-size:clamp(26px,7vw,40px);margin:0 0 6px;color:var(--danger);
    text-shadow:0 3px 0 #000;
  }
  #overlay p{margin:4px 0;font-size:16px;opacity:.9;}
  #overlay .score-big{font-size:22px;margin-top:14px;color:var(--cream);}
  #startBtn{
    margin-top:22px;padding:14px 34px;font-size:18px;font-weight:bold;
    background:var(--danger);color:#1a0505;border:none;border-radius:30px;
    cursor:pointer;font-family:inherit;box-shadow:0 4px 0 #7a1e1e;
  }
  #startBtn:active{transform:translateY(3px);box-shadow:0 1px 0 #7a1e1e;}
</style>
</head>
<body>
<div id="wrap">
  <div id="hud" class="hidden"><div class="now" id="scoreNow">0</div><div class="best" id="scoreBest">BEST 0</div></div>
  <canvas id="c"></canvas>
  <div id="overlay">
    <h1>Fallopian Flap</h1>
    <p>Tap / click / Space to swim up.</p>
    <div class="score-big" id="bestLine"></div>
    <button id="startBtn">Play</button>
  </div>
</div>
<script>
(function(){
  const canvas = document.getElementById('c');
  let ctx = canvas.getContext('2d');
  const hud = document.getElementById('hud');
  const overlay = document.getElementById('overlay');
  const startBtn = document.getElementById('startBtn');
  const bestLine = document.getElementById('bestLine');
  const scoreNow = document.getElementById('scoreNow');
  const scoreBest = document.getElementById('scoreBest');

  let W, H, DPR;
  function resize(){
    const wrap = document.getElementById('wrap');
    W = wrap.clientWidth; H = wrap.clientHeight;
    DPR = window.devicePixelRatio || 1;
    canvas.width = W*DPR; canvas.height = H*DPR;
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  window.addEventListener('resize', resize);
  resize();

  const GRAVITY = 1500;
  const FLAP_V = -420;
  const PIPE_W = 78;
  const GAP_BASE = 210;
  const GAP_MIN = 165;
  const SPEED_BASE = 172;   // was 155 (+~11%)
  const SPEED_MAX = 255;    // was 230
  const SPAWN_BASE = 1440;  // was 1600, keeps obstacle spacing the same
  const SPAWN_MIN = 1130;   // was 1250
  let GAP = GAP_BASE;
  let PIPE_SPEED = SPEED_BASE;
  let SPAWN_EVERY = SPAWN_BASE;

  function updateDifficulty(){
    const t = Math.min(1, score / 40);
    GAP = GAP_BASE - (GAP_BASE - GAP_MIN) * t;
    PIPE_SPEED = SPEED_BASE + (SPEED_MAX - SPEED_BASE) * t;
    SPAWN_EVERY = SPAWN_BASE - (SPAWN_BASE - SPAWN_MIN) * t;
  }

  let best = parseInt(localStorage.getItem('fallopianFlapBest')||'0',10) || 0;

  let sperm, pipes, score, running, over, lastSpawn, lastTime, tailPhase;

  // --- Audio: procedural squish/wet sounds ---
  let actx;
  function ensureAudio(){
    if (!actx){
      try { actx = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){ actx = null; }
    }
    if (actx && actx.state === 'suspended') actx.resume();
    if (actx && musicOn) startMusic();
  }
  function noiseBuffer(dur, decayPow){
    const n = Math.floor(actx.sampleRate*dur);
    const buf = actx.createBuffer(1, n, actx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i=0;i<n;i++){
      const env = decayPow ? Math.pow(1 - i/n, decayPow) : 1;
      d[i] = (Math.random()*2-1) * env;
    }
    return buf;
  }
  // short rising "bloop" — a wet bubble
  function bloop(t, f0, f1, dur, vol){
    const osc = actx.createOscillator();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(f0, t);
    osc.frequency.exponentialRampToValueAtTime(f1, t+dur);
    const g = actx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t+0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    osc.connect(g); g.connect(actx.destination);
    osc.start(t); osc.stop(t+dur+0.02);
  }

  function squishSound(kind){
    if (!actx) return;
    const now = actx.currentTime;
    const rnd = (a,b) => a + Math.random()*(b-a);

    if (kind === 'flap'){
      // squelchy noise swept down through a resonant band
      const dur = 0.22;
      const noise = actx.createBufferSource();
      noise.buffer = noiseBuffer(dur, 0);
      const filter = actx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.Q.value = rnd(5,8);
      filter.frequency.setValueAtTime(rnd(950,1350), now);
      filter.frequency.exponentialRampToValueAtTime(rnd(180,260), now+dur*0.85);
      const gain = actx.createGain();
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.5, now+0.015);
      gain.gain.exponentialRampToValueAtTime(0.16, now+0.07);
      gain.gain.exponentialRampToValueAtTime(0.38, now+0.12);
      gain.gain.exponentialRampToValueAtTime(0.001, now+dur);
      noise.connect(filter); filter.connect(gain); gain.connect(actx.destination);
      noise.start(now); noise.stop(now+dur);

      // fleshy low body
      const osc = actx.createOscillator();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(rnd(135,165), now);
      osc.frequency.exponentialRampToValueAtTime(85, now+0.08);
      osc.frequency.exponentialRampToValueAtTime(120, now+0.13);
      osc.frequency.exponentialRampToValueAtTime(60, now+dur);
      const oGain = actx.createGain();
      oGain.gain.setValueAtTime(0.001, now);
      oGain.gain.exponentialRampToValueAtTime(0.22, now+0.02);
      oGain.gain.exponentialRampToValueAtTime(0.001, now+dur);
      osc.connect(oGain); oGain.connect(actx.destination);
      osc.start(now); osc.stop(now+dur);

      // a little wet bubble on the tail end
      bloop(now+rnd(0.03,0.06), rnd(220,320), rnd(650,900), 0.06, 0.1);
      return;
    }

    if (kind === 'score'){
      // two rising wet bloops
      bloop(now, 320, 900, 0.09, 0.22);
      bloop(now+0.08, 480, 1400, 0.09, 0.2);
      const n = actx.createBufferSource();
      n.buffer = noiseBuffer(0.06, 3);
      const f = actx.createBiquadFilter();
      f.type='bandpass'; f.frequency.value = 1800; f.Q.value = 3;
      const g = actx.createGain(); g.gain.value = 0.12;
      n.connect(f); f.connect(g); g.connect(actx.destination);
      n.start(now);
      return;
    }

    // 'hit' — big wet SPLAT
    const dur = 0.5;
    const noise = actx.createBufferSource();
    noise.buffer = noiseBuffer(dur, 2.2);
    const filter = actx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.Q.value = 2.5;
    filter.frequency.setValueAtTime(3200, now);
    filter.frequency.exponentialRampToValueAtTime(140, now+dur);
    const gain = actx.createGain();
    gain.gain.setValueAtTime(0.75, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now+dur);
    noise.connect(filter); filter.connect(gain); gain.connect(actx.destination);
    noise.start(now); noise.stop(now+dur);

    // squelch: resonant band sweeping down
    const sq = actx.createBufferSource();
    sq.buffer = noiseBuffer(0.3, 1);
    const bp = actx.createBiquadFilter();
    bp.type = 'bandpass'; bp.Q.value = 9;
    bp.frequency.setValueAtTime(1500, now);
    bp.frequency.exponentialRampToValueAtTime(250, now+0.28);
    const sg = actx.createGain(); sg.gain.value = 0.45;
    sq.connect(bp); bp.connect(sg); sg.connect(actx.destination);
    sq.start(now); sq.stop(now+0.3);

    // thud
    const osc = actx.createOscillator();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(170, now);
    osc.frequency.exponentialRampToValueAtTime(45, now+0.3);
    const oGain = actx.createGain();
    oGain.gain.setValueAtTime(0.35, now);
    oGain.gain.exponentialRampToValueAtTime(0.001, now+0.3);
    osc.connect(oGain); oGain.connect(actx.destination);
    osc.start(now); osc.stop(now+0.32);

    // splatter: droplets landing
    for (let i=0;i<8;i++){
      const f0 = rnd(180, 520);
      bloop(now + rnd(0.06, 0.55), f0, f0*rnd(1.8,2.8), rnd(0.03,0.06), rnd(0.05,0.13));
    }
  }

  // --- Background music ---
  let musicNodes = null;
  let musicTimer = null;
  let musicOn = true;
  const scale = [130.81,146.83,155.56,196.00,220.00,233.08];

  function startMusic(){
    if (!actx || musicNodes) return;
    const master = actx.createGain();
    master.gain.value = 0.16;
    master.connect(actx.destination);

    const padGain = actx.createGain();
    padGain.gain.value = 0.5;
    padGain.connect(master);

    const filter = actx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 500;
    filter.connect(padGain);

    const osc1 = actx.createOscillator();
    osc1.type = 'triangle'; osc1.frequency.value = 65.41;
    const osc2 = actx.createOscillator();
    osc2.type = 'triangle'; osc2.frequency.value = 65.41*1.005;
    osc1.connect(filter); osc2.connect(filter);
    osc1.start(); osc2.start();

    const lfo = actx.createOscillator();
    lfo.type = 'sine'; lfo.frequency.value = 0.08;
    const lfoGain = actx.createGain();
    lfoGain.gain.value = 220;
    lfo.connect(lfoGain); lfoGain.connect(filter.frequency);
    lfo.start();

    musicNodes = { master, padGain, filter, osc1, osc2, lfo };

    function pluck(){
      if (!musicOn || !actx) return;
      const now = actx.currentTime;
      const freq = scale[Math.floor(Math.random()*scale.length)] * (Math.random()<0.3 ? 2 : 1);
      const osc = actx.createOscillator();
      osc.type = 'sine';
      osc.frequency.value = freq;
      const g = actx.createGain();
      g.gain.setValueAtTime(0, now);
      g.gain.linearRampToValueAtTime(0.12, now+0.05);
      g.gain.exponentialRampToValueAtTime(0.001, now+1.8);
      const f = actx.createBiquadFilter();
      f.type = 'lowpass'; f.frequency.value = 1200;
      osc.connect(f); f.connect(g); g.connect(master);
      osc.start(now); osc.stop(now+1.8);

      musicTimer = setTimeout(pluck, 1400 + Math.random()*1800);
    }
    musicTimer = setTimeout(pluck, 800);
  }

  function stopMusic(){
    if (musicTimer) clearTimeout(musicTimer);
    musicTimer = null;
    if (musicNodes){
      try{
        musicNodes.osc1.stop(); musicNodes.osc2.stop(); musicNodes.lfo.stop();
      }catch(e){}
      musicNodes = null;
    }
  }

  let microbes = [];
  function pickMicrobe(){
    const r = Math.random();
    return r < 0.36 ? 'bacteria' : r < 0.72 ? 'virus' : 'dead';
  }
  function initMicrobes(){
    microbes = [];
    for (let i=0;i<12;i++){
      microbes.push({
        type: pickMicrobe(),
        spin: Math.random()*Math.PI*2,
        bend: (Math.random() < 0.5 ? -1 : 1) * (0.3 + Math.random()*0.8),
        spinSpeed: (Math.random()-0.5)*0.6,
        x: Math.random()*W,
        y: Math.random()*H,
        s: 6 + Math.random()*7,
        speed: 12 + Math.random()*18,
        wobble: Math.random()*Math.PI*2,
        wspeed: 1+Math.random()*1.5,
        drift: (Math.random()-0.5)*10
      });
    }
  }

  // --- Fullscreen: entered on the player's first start (needs a user gesture) ---
  function enterFullscreen(){
    const el = document.documentElement;
    if (document.fullscreenElement || document.webkitFullscreenElement) return;
    const req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
    if (!req) return;
    try {
      const p = req.call(el, { navigationUI: 'hide' });
      if (p && p.catch) p.catch(()=>{});
    } catch(e){}
  }
  function onFullscreenChange(){
    setTimeout(() => {
      resize();
      if (sperm) sperm.x = W*0.28;
      if (!running && !rafId) render(performance.now()/1000);
    }, 50);
  }
  document.addEventListener('fullscreenchange', onFullscreenChange);
  document.addEventListener('webkitfullscreenchange', onFullscreenChange);

  // --- Wet FX: flying droplets + splats that stick ---
  let drops = [], splats = [], shake = 0, deathT = 0, rafId = null, overlayTimer = null;
  const SPLAT_COLORS = ['rgba(244,237,224,', 'rgba(255,214,200,', 'rgba(230,220,200,'];

  function emitDrops(x, y, n, opts){
    const o = Object.assign({ dir: Math.PI, spread: Math.PI*2, min: 80, max: 260, rmin: 1.5, rmax: 4, life: 0.7, pink: 0.3 }, opts);
    for (let i=0;i<n;i++){
      const a = o.dir + (Math.random()-0.5)*o.spread;
      const sp = o.min + Math.random()*(o.max-o.min);
      drops.push({
        x, y,
        vx: Math.cos(a)*sp, vy: Math.sin(a)*sp,
        r: o.rmin + Math.random()*(o.rmax-o.rmin),
        life: o.life*(0.6+Math.random()*0.6), age: 0,
        c: Math.random() < o.pink ? 'rgba(255,170,160,' : 'rgba(244,237,224,'
      });
    }
  }

  function addSplat(x, y, size){
    const pts = [];
    const n = 16;
    for (let i=0;i<n;i++){
      const a = (i/n)*Math.PI*2;
      const spike = Math.random() < 0.3 ? 1.35 + Math.random()*0.5 : 0.75 + Math.random()*0.35;
      pts.push({ a, r: size*spike });
    }
    const sats = [];
    for (let i=0;i<9;i++){
      const a = Math.random()*Math.PI*2;
      const d = size*(1.4 + Math.random()*1.4);
      sats.push({ x: Math.cos(a)*d, y: Math.sin(a)*d, r: 2 + Math.random()*size*0.18 });
    }
    const drips = [];
    for (let i=0;i<4;i++){
      drips.push({ x: (Math.random()-0.5)*size*1.4, w: 3 + Math.random()*4, len: 0, max: size*(0.8 + Math.random()*2.2), speed: 25 + Math.random()*45 });
    }
    splats.push({ x, y, pts, sats, drips, col: SPLAT_COLORS[Math.floor(Math.random()*SPLAT_COLORS.length)], age: 0 });
  }

  function updateFX(dt){
    for (const d of drops){
      d.age += dt;
      d.vy += 900*dt;
      d.vx *= (1 - 1.2*dt);
      d.x += d.vx*dt; d.y += d.vy*dt;
    }
    drops = drops.filter(d => d.age < d.life && d.y < H+20);
    for (const s of splats){
      s.age += dt;
      for (const dr of s.drips){ if (dr.len < dr.max) dr.len = Math.min(dr.max, dr.len + dr.speed*dt*(1 - dr.len/dr.max*0.7)); }
    }
    shake = Math.max(0, shake - 45*dt);
  }

  function drawFX(){
    // splats
    for (const s of splats){
      const pop = Math.min(1, s.age/0.08);           // quick splat-out
      ctx.save();
      ctx.translate(s.x, s.y);
      ctx.scale(pop, pop);
      ctx.fillStyle = s.col + '0.92)';
      // drips
      for (const dr of s.drips){
        ctx.beginPath();
        ctx.lineCap = 'round';
        ctx.strokeStyle = s.col + '0.9)';
        ctx.lineWidth = dr.w;
        ctx.moveTo(dr.x, 0);
        ctx.lineTo(dr.x, dr.len);
        ctx.stroke();
        ctx.beginPath(); ctx.arc(dr.x, dr.len, dr.w*0.85, 0, Math.PI*2); ctx.fill();
      }
      // main blob, smoothed through midpoints
      ctx.beginPath();
      const P = s.pts.map(p => ({ x: Math.cos(p.a)*p.r, y: Math.sin(p.a)*p.r }));
      const mid = (a,b) => ({ x:(a.x+b.x)/2, y:(a.y+b.y)/2 });
      let m0 = mid(P[P.length-1], P[0]);
      ctx.moveTo(m0.x, m0.y);
      for (let i=0;i<P.length;i++){
        const m = mid(P[i], P[(i+1)%P.length]);
        ctx.quadraticCurveTo(P[i].x, P[i].y, m.x, m.y);
      }
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = 'rgba(150,120,100,.35)'; ctx.lineWidth = 1.5; ctx.stroke();
      // satellite droplets
      for (const d of s.sats){ ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, Math.PI*2); ctx.fill(); }
      // glossy highlight
      ctx.fillStyle = 'rgba(255,255,255,.55)';
      ctx.beginPath(); ctx.ellipse(-s.pts[0].r*0.3, -s.pts[0].r*0.35, s.pts[0].r*0.28, s.pts[0].r*0.14, -0.5, 0, Math.PI*2); ctx.fill();
      ctx.restore();
    }
    // flying droplets
    for (const d of drops){
      const a = Math.max(0, 1 - d.age/d.life);
      ctx.fillStyle = d.c + (0.85*a).toFixed(3) + ')';
      ctx.beginPath();
      // stretch along velocity for a wet streak
      const sp = Math.hypot(d.vx, d.vy);
      ctx.ellipse(d.x, d.y, d.r*(1 + Math.min(1.5, sp/300)), d.r, Math.atan2(d.vy, d.vx), 0, Math.PI*2);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,' + (0.6*a).toFixed(3) + ')';
      ctx.beginPath(); ctx.arc(d.x - d.r*0.3, d.y - d.r*0.3, d.r*0.35, 0, Math.PI*2); ctx.fill();
    }
  }

  function updateHud(){
    scoreNow.textContent = score;
    const shown = Math.max(best, score);
    scoreBest.textContent = 'BEST ' + shown;
    scoreBest.classList.toggle('beat', score > best && best > 0);
  }

  function startLoop(){
    if (rafId) cancelAnimationFrame(rafId);
    lastTime = performance.now();
    rafId = requestAnimationFrame(loop);
  }

  function reset(){
    sperm = { x: W*0.28, y: H*0.4, vy: 0, r: 16, rot:0 };
    pipes = [];
    score = 0;
    running = false;
    over = false;
    lastSpawn = 0;
    tailPhase = 0;
    drops = []; splats = []; shake = 0; deathT = 0;
    updateHud();
    GAP = GAP_BASE; PIPE_SPEED = SPEED_BASE; SPAWN_EVERY = SPAWN_BASE;
    initMicrobes();
  }
  reset();

  function spawnPipe(){
    const margin = 70;
    const gapY = margin + Math.random()*(H - margin*2 - GAP);
    pipes.push({ x: W+PIPE_W, gapY, gap: GAP, passed:false, seed: Math.floor(Math.random()*1e9) });
  }

  function flap(){
    ensureAudio();
    if (over) return;
    if (!running){ enterFullscreen(); running = true; overlay.style.display='none'; hud.classList.remove('hidden'); startLoop(); }
    sperm.vy = FLAP_V;
    squishSound('flap');
    // little wet spray off the tail
    emitDrops(sperm.x - 40, sperm.y, 7, { dir: Math.PI + 0.5, spread: 1.4, min: 90, max: 240, rmin: 1.5, rmax: 3.5, life: 0.55 });
  }

  function endGame(hx, hy){
    if (over) return;
    squishSound('hit');
    over = true; running = false; deathT = 0;
    const x = hx ?? sperm.x, y = hy ?? sperm.y;
    addSplat(x, y, 26);
    emitDrops(x, y, 40, { min: 140, max: 460, rmin: 2, rmax: 5.5, life: 0.9, pink: 0.45 });
    shake = 12;
    const isNew = score > best;
    if (isNew){ best = score; try { localStorage.setItem('fallopianFlapBest', best); } catch(e){} }
    updateHud();
    bestLine.innerHTML = 'Score: ' + score + '<br>Best: ' + best +
      (isNew && score > 0 ? '<br><span class="newbest">NEW BEST!</span>' : '');
    startBtn.textContent = 'Play Again';
    clearTimeout(overlayTimer);
    overlayTimer = setTimeout(() => { overlay.style.display = 'flex'; }, 750);
  }

  function rectCircleColl(cx,cy,cr, rx,ry,rw,rh){
    const nx = Math.max(rx, Math.min(cx, rx+rw));
    const ny = Math.max(ry, Math.min(cy, ry+rh));
    const dx = cx-nx, dy = cy-ny;
    return (dx*dx+dy*dy) < cr*cr;
  }

  // --- Drawing: sperm (semi-realistic, cartoon-inked) ---
  // Faces +x: plump oval head with acrosome cap, short midpiece, tapering wavy tail, bold outline.
  function drawRealSperm(sc, t, o){
    o = o || {};
    const dead = !!o.dead;
    const hl = 15*sc, hw = 11*sc;            // head half-length / half-width
    const mp = 9*sc;                         // midpiece length
    const L  = (dead ? 62 : 72)*sc;          // tail length
    const x0 = -hl - mp + 2*sc;
    const ink = dead ? 'rgba(70,60,48,.85)' : 'rgba(55,40,45,.9)';
    const inkW = Math.max(1.2, 2*sc);

    // tail centreline
    const N = 26, P = [];
    for (let i=0;i<=N;i++){
      const s = i/N;
      let y;
      if (dead){
        y = (o.bend||1)*s*s*L*0.45 + Math.sin(s*5 + t*0.8 + (o.seed||0))*2.5*sc*s;
      } else {
        const amp = (o.amp||9)*sc * Math.pow(s, 0.85);
        y = amp*Math.sin(s*Math.PI*2.2 - t*(o.speed||13));
      }
      P.push({ x: x0 - s*L, y });
    }
    const ribbon = (extra) => {
      const left = [], right = [];
      for (let i=0;i<=N;i++){
        const s = i/N;
        const a = P[Math.max(0,i-1)], c = P[Math.min(N,i+1)];
        const dx = c.x-a.x, dy = c.y-a.y, len = Math.hypot(dx,dy)||1;
        const nx = -dy/len, ny = dx/len;
        const w = ((6 - 4.8*s)*sc)/2 + extra;
        left.push([P[i].x+nx*w, P[i].y+ny*w]);
        right.push([P[i].x-nx*w, P[i].y-ny*w]);
      }
      ctx.beginPath();
      ctx.moveTo(left[0][0], left[0][1]);
      for (const q of left) ctx.lineTo(q[0], q[1]);
      // rounded tip
      const tip = P[N];
      ctx.arc(tip.x, tip.y, Math.hypot(left[N][0]-tip.x, left[N][1]-tip.y), 0, Math.PI*2, false);
      for (let i=right.length-1;i>=0;i--) ctx.lineTo(right[i][0], right[i][1]);
      ctx.closePath();
    };
    const tailFill = dead ? 'rgb(196,188,170)' : 'rgb(240,236,228)';

    // shadow mode: one flat silhouette of the whole body (tail follows the same wave)
    if (o.silhouette){
      ctx.fillStyle = ctx.strokeStyle = o.silhouette;
      ribbon(inkW); ctx.fill();
      ctx.lineCap = 'round'; ctx.lineWidth = 7*sc + inkW*2;
      ctx.beginPath(); ctx.moveTo(-hl+3*sc, 0); ctx.lineTo(x0, P[0].y); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(hl, 0);
      ctx.bezierCurveTo(hl, -hw*1.25, -hl*0.7, -hw*1.15, -hl, -hw*0.45);
      ctx.quadraticCurveTo(-hl*1.12, 0, -hl, hw*0.45);
      ctx.bezierCurveTo(-hl*0.7, hw*1.15, hl, hw*1.25, hl, 0);
      ctx.closePath();
      ctx.fill();
      ctx.lineWidth = inkW; ctx.stroke();
      return;
    }

    // tail: ink outline underneath, then fill
    ribbon(inkW); ctx.fillStyle = ink; ctx.fill();
    ribbon(0);    ctx.fillStyle = tailFill; ctx.fill();

    // midpiece
    ctx.lineCap = 'round';
    ctx.strokeStyle = ink; ctx.lineWidth = 7*sc + inkW*2;
    ctx.beginPath(); ctx.moveTo(-hl+3*sc, 0); ctx.lineTo(x0, P[0].y); ctx.stroke();
    ctx.strokeStyle = dead ? 'rgb(182,173,154)' : 'rgb(226,220,208)'; ctx.lineWidth = 7*sc;
    ctx.beginPath(); ctx.moveTo(-hl+3*sc, 0); ctx.lineTo(x0, P[0].y); ctx.stroke();

    // head: plump egg, slightly narrower at the neck
    const head = () => {
      ctx.beginPath();
      ctx.moveTo(hl, 0);
      ctx.bezierCurveTo(hl, -hw*1.25, -hl*0.7, -hw*1.15, -hl, -hw*0.45);
      ctx.quadraticCurveTo(-hl*1.12, 0, -hl, hw*0.45);
      ctx.bezierCurveTo(-hl*0.7, hw*1.15, hl, hw*1.25, hl, 0);
      ctx.closePath();
    };
    const g = ctx.createRadialGradient(hl*0.2, -hw*0.4, 1, 0, 0, hl*1.25);
    if (dead){ g.addColorStop(0,'rgb(226,218,200)'); g.addColorStop(1,'rgb(168,158,138)'); }
    else     { g.addColorStop(0,'rgb(255,254,250)'); g.addColorStop(1,'rgb(214,206,192)'); }
    head(); ctx.fillStyle = g; ctx.fill();

    ctx.save();
    head(); ctx.clip();
    // nucleus shading toward the back
    ctx.fillStyle = dead ? 'rgba(100,90,72,.18)' : 'rgba(150,130,120,.16)';
    ctx.beginPath(); ctx.ellipse(-hl*0.45, hw*0.15, hl*0.75, hw*0.9, 0, 0, Math.PI*2); ctx.fill();
    // acrosome cap
    ctx.strokeStyle = dead ? 'rgba(110,100,82,.35)' : 'rgba(170,150,140,.45)';
    ctx.lineWidth = 1.2*sc;
    ctx.beginPath(); ctx.ellipse(hl*0.7, 0, hl*0.75, hw*1.3, 0, Math.PI*0.62, Math.PI*1.38); ctx.stroke();
    // shine
    ctx.fillStyle = 'rgba(255,255,255,.75)';
    ctx.beginPath(); ctx.ellipse(-hl*0.15, -hw*0.62, hl*0.32, hw*0.16, -0.1, 0, Math.PI*2); ctx.fill();
    ctx.restore();

    head(); ctx.strokeStyle = ink; ctx.lineWidth = inkW; ctx.stroke();

    // face
    const eyes = [[hl*0.28, -hw*0.28], [hl*0.66, -hw*0.02]];
    if (dead){
      ctx.strokeStyle = 'rgba(45,36,28,.95)';
      ctx.lineWidth = Math.max(1.3, 1.9*sc);
      ctx.lineCap = 'round';
      const e = hw*0.2;
      for (const [ex,ey] of eyes){
        ctx.beginPath();
        ctx.moveTo(ex-e,ey-e); ctx.lineTo(ex+e,ey+e);
        ctx.moveTo(ex+e,ey-e); ctx.lineTo(ex-e,ey+e);
        ctx.stroke();
      }
    } else {
      for (const [ex,ey] of eyes){
        ctx.fillStyle = '#2a1e1a';
        ctx.beginPath(); ctx.ellipse(ex, ey, 2.4*sc, 2.9*sc, 0, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,.9)';
        ctx.beginPath(); ctx.arc(ex+0.8*sc, ey-1.1*sc, 0.9*sc, 0, Math.PI*2); ctx.fill();
      }
    }
  }

  function drawSperm(t){
    // beat faster right after a flap
    const boost = Math.max(0, -sperm.vy/420);
    const opts = { amp: 9 + 3*boost, speed: 13 + 6*boost };

    // shadow: same shape and pose as the sperm, dropped slightly down-right
    ctx.save();
    ctx.translate(sperm.x + 4, sperm.y + 11);
    ctx.rotate(sperm.rot*0.4);
    ctx.scale(1, 0.9);
    drawRealSperm(1.1, t, Object.assign({ silhouette: 'rgba(0,0,0,.22)' }, opts));
    ctx.restore();

    ctx.save();
    ctx.translate(sperm.x, sperm.y);
    ctx.rotate(sperm.rot*0.4);
    drawRealSperm(1.1, t, opts);
    ctx.restore();
  }

  // --- Obstacles: fleshy folds (art cached per obstacle; hit boxes unchanged) ---
  function seeded(seed){
    let s = (seed>>>0) || 1;
    return () => { s = (s*1664525 + 1013904223) >>> 0; return s/4294967296; };
  }

  // One fold. endY = rounded tip facing the gap; dir = -1 grows from the top wall, +1 from the bottom wall.
  function drawFold(p, t, endY, dir, len, rnd, mode){
    const x = p.x, w = PIPE_W;
    const s1 = rnd()*10, s2 = rnd()*10;
    if (mode === 'cilia'){ drawCilia(x, w, t, endY, dir, s1, s2); return; }
    // organic, lumpy sides that flare out where the fold joins the wall
    const inset = d => {
      let v = 2.5*Math.sin(d*0.045 + s1) + 1.8*Math.sin(d*0.11 + s2) + 2;
      const toBase = len - d;
      if (toBase < 20) v -= 7*Math.pow(1 - toBase/20, 2);   // small fillet hidden under the wall lining
      return v;
    };
    const Y = d => endY + dir*d;
    const STEP = 4;
    // lumpy rounded tip (like before), as smooth lobes across the width
    const bumps = 5, tip = [];
    for (let i=0;i<=bumps;i++){
      const bx = x + inset(0) + (w - 2*inset(0))*i/bumps;
      const bump = 4 + 6*Math.abs(Math.sin(s1*3 + i*1.7));
      tip.push({ x: bx, y: endY - dir*(i===0||i===bumps ? -2 : bump*0.4) });
    }
    const body = () => {
      ctx.beginPath();
      // tip: left corner -> lobes -> right corner (rounded)
      ctx.moveTo(x + inset(10), Y(10));
      ctx.quadraticCurveTo(x + inset(0) - 1, Y(0), tip[0].x + 4, endY - dir*4);
      for (let i=1;i<=bumps;i++){
        const a = tip[i-1], b = tip[i];
        const mx = (a.x+b.x)/2, my = endY - dir*(6 + 6*Math.abs(Math.sin(s2 + i*2.1)));
        ctx.quadraticCurveTo(mx, my, b.x - (i===bumps?4:0), i===bumps ? endY - dir*4 : b.y);
      }
      ctx.quadraticCurveTo(x + w - inset(0) + 1, Y(0), x + w - inset(10), Y(10));
      for (let d=10; d<=len; d+=STEP) ctx.lineTo(x + w - inset(d), Y(d));
      ctx.lineTo(x + w - inset(len), Y(len+30));
      ctx.lineTo(x + inset(len), Y(len+30));
      for (let d=Math.floor(len/STEP)*STEP; d>=10; d-=STEP) ctx.lineTo(x + inset(d), Y(d));
      ctx.closePath();
    };
    const g = ctx.createLinearGradient(x - 14, 0, x + w + 14, 0);
    g.addColorStop(0,    '#5e1820');
    g.addColorStop(0.25, '#9c3a3a');
    g.addColorStop(0.45, '#d06a6e');
    g.addColorStop(0.65, '#b5453a');
    g.addColorStop(1,    '#5a1520');
    body(); ctx.fillStyle = g; ctx.fill();

    ctx.save();
    body(); ctx.clip();
    // lengthwise mucosal folds
    ctx.strokeStyle = 'rgba(110,22,35,.3)'; ctx.lineWidth = 2;
    for (let k=0;k<3;k++){
      const fx = x + w*(0.28 + k*0.22);
      ctx.beginPath();
      for (let d=0; d<=len; d+=8){
        const xx = fx + Math.sin(d*0.06 + k*2 + s1)*3;
        d===0 ? ctx.moveTo(xx, Y(d)) : ctx.lineTo(xx, Y(d));
      }
      ctx.stroke();
    }
    // soft fleshy creases (from the earlier look)
    ctx.strokeStyle = 'rgba(255,180,160,.3)'; ctx.lineWidth = 3;
    for (let d = 26 + rnd()*10; d < len - 10; d += 44 + rnd()*22){
      ctx.beginPath();
      ctx.moveTo(x + 10, Y(d));
      ctx.quadraticCurveTo(x + w/2, Y(d) - dir*10, x + w - 10, Y(d));
      ctx.stroke();
    }
    // little blood vessels
    ctx.strokeStyle = 'rgba(150,20,45,.5)'; ctx.lineWidth = 1.2;
    const nV = Math.max(1, Math.floor(len/100));
    for (let v=0; v<nV; v++){
      let vx = x + w*(0.15 + rnd()*0.7), vd = 20 + rnd()*Math.max(10, len-40);
      ctx.beginPath(); ctx.moveTo(vx, Y(vd));
      for (let s=0;s<6;s++){ vx += (rnd()-0.5)*12; vd += 6 + rnd()*6; ctx.lineTo(vx, Y(vd)); }
      ctx.stroke();
    }
    // wet sheen
    ctx.fillStyle = 'rgba(255,225,220,.16)';
    ctx.beginPath(); ctx.ellipse(x + w*0.4, Y(Math.min(len, 160)/2), w*0.06, Math.min(len,160)/2, 0, 0, Math.PI*2); ctx.fill();
    ctx.restore();

    body(); ctx.strokeStyle = 'rgba(60,12,22,.9)'; ctx.lineWidth = 2; ctx.stroke();
  }

  function drawCilia(x, w, t, endY, dir, s1, s2){
    // tiny cilia waving on the tip
    ctx.strokeStyle = 'rgba(240,160,165,.75)'; ctx.lineWidth = 1.3; ctx.lineCap = 'round';
    for (let i=0;i<9;i++){
      const cx = x + 8 + (w-16)*i/8;
      const cy = endY - dir*(5 + 3*Math.abs(Math.sin(s2 + i)));
      const sway = Math.sin(t*6 + i*0.9 + s1)*3;
      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.quadraticCurveTo(cx + sway*0.5, cy - dir*4, cx + sway, cy - dir*7); ctx.stroke();
    }
  }

  // tips sit 8px inside the hit box so the lumps don't poke into the gap
  const TIP_IN = 8;
  function foldArgs(p, x){
    const q = { x, seed: p.seed };
    const by = p.gapY + p.gap;
    return [
      [q, p.gapY - TIP_IN, -1, p.gapY - TIP_IN + 12, seeded(p.seed)],
      [q, by + TIP_IN,      1, H - by - TIP_IN + 12, seeded(p.seed + 7)]
    ];
  }
  function buildTubeCache(p){
    const PAD = 20;
    const c = document.createElement('canvas');
    const CD = Math.min(DPR, 2);
    c.width = Math.ceil((PIPE_W + PAD*2)*CD); c.height = Math.ceil(H*CD);
    const cctx = c.getContext('2d');
    cctx.setTransform(CD,0,0,CD,0,0);
    const saved = ctx; ctx = cctx;
    try { for (const a of foldArgs(p, PAD)) drawFold(a[0], 0, a[1], a[2], a[3], a[4], 'body'); }
    finally { ctx = saved; }
    p.cache = c; p.cacheH = H; p.cacheDPR = DPR;
  }
  function drawTube(p, t){
    if (!p.cache || p.cacheH !== H || p.cacheDPR !== DPR) buildTubeCache(p);
    ctx.drawImage(p.cache, p.x - 20, 0, PIPE_W + 40, H);
    for (const a of foldArgs(p, p.x)) drawFold(a[0], t, a[1], a[2], a[3], a[4], 'cilia');
  }

  function drawBackground(t){
    ctx.save();
    ctx.fillStyle='rgba(255,220,200,.15)';
    for(let i=0;i<14;i++){
      const px = (i*67 + t*20) % W;
      const py = (i*113) % H;
      ctx.beginPath(); ctx.arc(px,py, 2+ (i%3), 0, Math.PI*2); ctx.fill();
    }
    ctx.restore();
    drawMicrobes(t);
  }

  function updateMicrobes(dt){
    for (const m of microbes){
      m.x -= m.speed*dt;
      m.wobble += m.wspeed*dt;
      m.y += Math.sin(m.wobble)*m.drift*dt;
      m.spin += m.spinSpeed*dt;
      if (m.x < -110){
        m.x = W+110;
        m.y = Math.random()*H;
        m.type = pickMicrobe();
      }
    }
  }

  function drawMicrobes(t){
    ctx.save();
    for (const m of microbes){
      ctx.save();
      ctx.translate(m.x, m.y);
      ctx.globalAlpha = 0.45;
      if (m.type === 'dead'){
        // a limp, washed-out sperm slowly tumbling
        ctx.rotate(m.spin);
        ctx.globalAlpha = 0.5;
        drawRealSperm(0.5 + m.s*0.04, t, { dead: true, bend: m.bend, seed: m.wobble });
      } else if (m.type === 'bacteria'){
        ctx.rotate(Math.sin(m.wobble*0.5)*0.4);
        ctx.fillStyle = '#8fbf5a';
        ctx.strokeStyle = '#517a2e';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.ellipse(0,0, m.s*1.8, m.s*0.7, 0, 0, Math.PI*2);
        ctx.fill(); ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(m.s*1.8, 0);
        ctx.quadraticCurveTo(m.s*2.6, Math.sin(t*6)*4, m.s*3.4, 0);
        ctx.strokeStyle='rgba(81,122,46,.6)';
        ctx.stroke();
      } else {
        ctx.fillStyle = '#7fb8c9';
        ctx.strokeStyle = '#3d6a76';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(0,0,m.s,0,Math.PI*2);
        ctx.fill(); ctx.stroke();
        const spikes = 8;
        ctx.strokeStyle = '#3d6a76';
        for (let i=0;i<spikes;i++){
          const ang = (i/spikes)*Math.PI*2 + m.wobble*0.3;
          const x1 = Math.cos(ang)*m.s, y1 = Math.sin(ang)*m.s;
          const x2 = Math.cos(ang)*(m.s+4), y2 = Math.sin(ang)*(m.s+4);
          ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
          ctx.beginPath(); ctx.arc(x2,y2,1.5,0,Math.PI*2); ctx.fill();
        }
      }
      ctx.restore();
    }
    ctx.restore();
  }

  function update(dt){
    updateMicrobes(dt);
    sperm.vy += GRAVITY*dt;
    sperm.y += sperm.vy*dt;
    sperm.rot = Math.max(-0.5, Math.min(1.3, sperm.vy/500));

    if (sperm.y - sperm.r < 0){ sperm.y = sperm.r; sperm.vy = 0; }
    if (sperm.y + sperm.r > H){ sperm.y = H - sperm.r; endGame(sperm.x, H - 6); return; }

    lastSpawn += dt*1000;
    if (lastSpawn > SPAWN_EVERY){ spawnPipe(); lastSpawn = 0; }

    for (const p of pipes){
      p.x -= PIPE_SPEED*dt;
      if (!p.passed && p.x+PIPE_W < sperm.x){
        p.passed = true; score++; updateHud(); updateDifficulty(); squishSound('score');
        emitDrops(sperm.x + 10, sperm.y, 6, { min: 60, max: 180, rmin: 1.5, rmax: 3, life: 0.45, pink: 0.8 });
      }
      const hitTop = rectCircleColl(sperm.x,sperm.y,sperm.r-4, p.x,0,PIPE_W,p.gapY);
      const hitBot = rectCircleColl(sperm.x,sperm.y,sperm.r-4, p.x,p.gapY+p.gap,PIPE_W,H-(p.gapY+p.gap));
      if (hitTop || hitBot){
        // splat lands on the wall where we hit it
        const hx = Math.max(p.x, Math.min(sperm.x + sperm.r*0.6, p.x + PIPE_W));
        const hy = hitTop ? Math.min(sperm.y, p.gapY - 4) : Math.max(sperm.y, p.gapY + p.gap + 4);
        endGame(hx, hy);
        return;
      }
    }
    pipes = pipes.filter(p => p.x > -PIPE_W-10);
  }

  function render(t){
    ctx.clearRect(0,0,W,H);
    ctx.save();
    if (shake > 0) ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
    const g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#2b0a0a'); g.addColorStop(1,'#4a1414');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    drawBackground(t);
    for (const p of pipes) drawTube(p, t);
    if (!over) drawSperm(t);
    drawFX();
    ctx.restore();
  }

  function loop(now){
    // Real elapsed time, split into steps no bigger than 1/60s so the game runs at
    // the same speed even when the phone drops frames (identical to before at 30fps+).
    const elapsed = Math.min(0.1, Math.max(0, (now-lastTime)/1000));
    lastTime = now;
    const steps = Math.max(1, Math.ceil(elapsed / (1/60) - 1e-6));
    const dt = elapsed / steps;
    if (running){ for (let i=0; i<steps && running; i++) update(dt); }
    else if (over) deathT += elapsed;
    updateFX(elapsed);
    render(now/1000);
    // keep animating briefly after death so the splat plays out
    if (running || (over && deathT < 2)) rafId = requestAnimationFrame(loop);
    else rafId = null;
  }

  canvas.addEventListener('pointerdown', flap);
  window.addEventListener('keydown', e => { if (e.code==='Space'){ e.preventDefault(); flap(); }});
  startBtn.addEventListener('click', () => {
    enterFullscreen();
    ensureAudio();
    clearTimeout(overlayTimer);
    reset();
    overlay.style.display='none';
    hud.classList.remove('hidden');
    running = true;
    startLoop();
  });

  hud.classList.add('hidden');
  render(0);
  if (best>0) bestLine.textContent = 'Best: ' + best;
})();
</script>
</body>
</html>
